<html lang="en">

  // usernode-dev-console@1
  (function () {

    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;

        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }

    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';

  <title>Bread Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238c4a1e' stroke-width='1.6' stroke-linecap='round'><path d='M12 21V8'/><path d='M12 8c-2-1-3-3-3-5 2 1 3 3 3 5z'/><path d='M12 8c2-1 3-3 3-5-2 1-3 3-3 5z'/><path d='M12 13c-2.5-.5-4-2.5-4-4.5 2.5.5 4 2.5 4 4.5z'/><path d='M12 13c2.5-.5 4-2.5 4-4.5-2.5.5-4 2.5-4 4.5z'/><path d='M12 18c-2.5-.5-4-2.5-4-4.5 2.5.5 4 2.5 4 4.5z'/><path d='M12 18c2.5-.5 4-2.5 4-4.5-2.5.5-4 2.5-4 4.5z'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div><main>
    <p id="demo-note" class="kit-demo-label" role="note" hidden>Staging demo: sample settings</p>
    <header class="hdr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 21V8"/><path d="M12 8c-2-1-3-3-3-5 2 1 3 3 3 5z"/><path d="M12 8c2-1 3-3 3-5-2 1-3 3-3 5z"/><path d="M12 13c-2.5-.5-4-2.5-4-4.5 2.5.5 4 2.5 4 4.5z"/><path d="M12 13c2.5-.5 4-2.5 4-4.5-2.5.5-4 2.5-4 4.5z"/><path d="M12 18c-2.5-.5-4-2.5-4-4.5 2.5.5 4 2.5 4 4.5z"/><path d="M12 18c2.5-.5 4-2.5 4-4.5-2.5.5-4 2.5-4 4.5z"/></svg><h1 class="text-title">Bread Bot</h1></header>

    <section><h2 class="section-label">Bread</h2><div class="chips" id="bread-types">
    <button type="button" class="chip on" data-bread="sourdough" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 15c0-5 4-8 9-8s9 3 9 8v2H3z"/><path d="M9 10l2 3M13 9l2 3"/></svg>Sourdough</button>
    <button type="button" class="chip" data-bread="bagels" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>Bagels</button>
    <button type="button" class="chip" data-bread="sourdough-bagels" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M8 7l1 1.5M15 6.5l-.8 1.5M17 14l-1.5-.5"/></svg>Sourdough bagels</button>
    <button type="button" class="chip" data-bread="rye" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 16c0-4 4-7 9-7s9 3 9 7v1H3z"/><path d="M7 12h10M6 14.5h12"/></svg>Rye</button>
    <button type="button" class="chip" data-bread="sandwich" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 19V11a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v8z"/><path d="M5 13h14"/></svg>Sandwich loaf</button>
    </div></section>

    <section><h2 class="section-label">Dough</h2><div class="list">
    <div class="list-row" style="display:block"><div style="display:flex;justify-content:space-between"><label for="hydration">Hydration</label><span class="num" id="hyd-val" style="font-weight:600"></span></div>
    <input type="range" class="range" id="hydration" min="50" max="90" step="1" value="75">
    <div class="ends text-small muted num"><span>50%</span><span>90%</span></div></div>
    <div class="list-row"><span class="row-main" id="loaves-label">Loaves</span><div class="stepper"><button type="button" id="loaves-minus" aria-label="Fewer loaves">−</button><span class="num" id="loaves-val" aria-live="polite"></span><button type="button" id="loaves-plus" aria-label="More loaves">+</button></div></div>
    <div class="list-row" style="display:block"><label class="row-main" for="weight" style="display:block">Baked weight<br><span class="text-small muted" id="weight-unit">per loaf</span></label>
    <div style="display:flex;align-items:center;gap:6px"><input class="field num" id="weight" inputmode="numeric" placeholder="e.g. 800" aria-describedby="weight-error" style="text-align:right"><span class="muted">g</span></div>
    <p class="kit-error" id="weight-error" hidden></p></div>
    </div></section>

    <button type="button" class="btn-primary" id="calculate">Calculate</button>

    <div id="recipe">
    <p class="state-empty" id="recipe-empty">Type a baked weight per loaf to see your recipe.</p>
    <section class="card" id="sheet" hidden><div class="sheet-head"><h2 class="text-heading" id="sheet-title"></h2><span class="text-small muted num" id="sheet-sub"></span></div>
    <table class="num"><thead><tr><th>Ingredient</th><th>Grams</th><th>Baker's %</th></tr></thead><tbody id="sheet-rows"></tbody></table></section>
    </div>

    <section id="timeline" hidden><h2 class="section-label">Rise and bake</h2>
    <div class="strip" id="strip"></div>
    <div class="list" id="timeline-rows"></div></section>

    <section class="card" id="oven" hidden><h2 class="section-label" style="padding:0">Oven</h2><div class="bake num"><div><div class="big" id="oven-c"></div><div class="text-small muted" id="oven-c-sub"></div></div><div><div class="big" id="oven-time"></div><div class="text-small muted" id="oven-time-sub"></div></div></div></section>
    </main></div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script type="module" src="/app.js"></script>
</body>
</html>
