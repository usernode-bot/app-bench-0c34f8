  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || val.name + ': ' + val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });

  </script>
  <title>Bread Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='56' rx='42' ry='32' fill='%237a451e'/><path d='M28 44l7 12M45 38l5 14M62 40l3 12' stroke='%23f6ecdd' stroke-width='5' stroke-linecap='round' fill='none'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
  <!-- Which environment this build runs in; the staging demo (?demo=1) reads
       it so the demo only turns on on staging. -->
  <script src="/env.js"></script>

<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div><div class="app">
    <header><h1 class="serif">Bread Bot</h1><p class="sub">Choose a bread, set the dough, get the recipe.</p></header>
    <section><p class="section-label">Bread</p><div class="kinds">
    <button type="button" class="kind on" data-kind="sourdough" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><ellipse cx="12" cy="13" rx="9" ry="7"/><path d="M8 10l3 3M11 9l3 3M14 8.5l3 3"/></svg>Sourdough</button>
    <button type="button" class="kind" data-kind="bagels" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Bagels</button>
    <button type="button" class="kind" data-kind="sourdough-bagels" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M15 5.5l2 2"/></svg>Sourdough bagels</button>
    <button type="button" class="kind" data-kind="rye" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="5.5"/><path d="M8 11v.01M12 13v.01M16 11v.01M10 15v.01M14 10v.01"/></svg>Rye</button>
    <button type="button" class="kind" data-kind="sandwich" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linejoin="round"><path d="M5 20V11a4 4 0 0 1-1-2.5C4 6 7 4 12 4s8 2 8 4.5a4 4 0 0 1-1 2.5v9z"/></svg>Sandwich loaf</button>
    </div></section>
    <section class="card"><div class="hyd-head"><label class="flabel" for="hydration">Hydration</label><span class="hyd-num" id="hyd-num">75%</span></div>
    <p class="sub">Water as a share of the flour weight.</p>
    <div class="gauge"><div class="track"></div><div class="fill" id="gauge-fill"></div><div class="thumb" id="gauge-thumb"></div><input type="range" id="hydration" class="gauge-input" min="50" max="90" step="1" value="75" aria-label="Hydration percent of the flour weight"></div>
    <div class="ticks"><span>50% stiff</span><span>70% soft</span><span>90% wet</span></div></section>
    <section class="row2"><div><span class="flabel" id="count-label">Loaves</span><div class="stepper"><button type="button" id="count-minus" aria-label="Fewer loaves">&minus;</button><span id="count" aria-live="polite">1</span><button type="button" id="count-plus" aria-label="More loaves">+</button></div><p class="kit-error" id="count-error" hidden></p></div>
    <div><label class="flabel" for="size" id="size-label">Each loaf weighs</label><div class="field"><input id="size" type="number" inputmode="numeric" min="50" max="3000" step="1" value="900"><i>g</i></div><p class="kit-error" id="size-error" hidden></p></div></section>
    <button type="button" class="btn-primary" id="calc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h1M15 11h1M8 15h2M12 15h1M15 15h1"/></svg>Calculate recipe</button>
    <div class="state-empty" id="slip-empty"><p class="text-body text-muted">Your recipe shows here. Pick a bread and tap Calculate recipe.</p></div>
    <article class="slip" id="slip" hidden>
    <div class="slip-top"><h2 class="serif" id="slip-title"></h2><p class="sub" id="slip-sub"></p><p class="sub" id="slip-stale" hidden>Settings changed. Tap Calculate recipe to update.</p></div>
    <ul class="list" id="ing">
    <li class="list-row"><span class="ing"></span><span class="pct"></span><span class="g"></span></li>
    <li class="list-row total"><span class="ing"></span><span class="pct"></span><span class="g"></span></li>
    </ul>
    <div class="part"><h3 class="serif">Rise</h3><ol class="steps" id="steps">
    <li><span class="n">1</span><span><strong></strong><br><span class="sub"></span></span></li>
    </ol></div>
    <div class="part"><h3 class="serif">Bake</h3><div class="bake" id="bake">
    <div class="oven"><div class="temp"></div><p class="sub"></p></div>
    </div><p class="sub" style="margin-top:8px" id="bake-note" hidden></p></div>
    </article>
    </div></div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script type="module" src="/app.js"></script>
</body>
</html>
