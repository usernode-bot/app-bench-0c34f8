  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's

  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');

        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();

  <template data-spec-screen="2">

      <div>
      <div class="s">
      <main>
      <article class="kit-detail">
        <header class="kit-detail-head">
          <button class="btn-secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>All questions</button>
          <h2 class="text-title">Raise yearly dues from 10 to 15 to cover the room hire?</h2>
          <div class="byline"><span>Asked by Dev, 4 days ago</span><button class="report">Report</button></div>
          <p class="kit-detail-body">The hall has put its rate up to 40 a month. At 10 each we fall about 60 short over the year. Raising dues covers it, with a little left for the summer outing.</p>
        </header>

        <section>
          <h3 class="section-label">Your vote</h3>
          <div class="ballot">
            <div class="tally-big"><span class="tally-yes" style="flex:5"></span><span class="tally-no" style="flex:6"></span></div>
            <div class="tally-key"><span class="yes">Yes <span class="n">5</span> · 45%</span><span class="no">No <span class="n">6</span> · 55%</span></div>
            <div class="kit-votes-row">
              <button class="kit-vote" aria-pressed="false"><span class="kit-vote-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="kit-vote-label">Yes</span><span class="kit-vote-count">5</span></button>
              <button class="kit-vote" aria-pressed="true"><span class="kit-vote-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="kit-vote-label">No</span><span class="kit-vote-count">6</span></button>
            </div>
            <p class="kit-vote-summary">11 votes, No leads. You voted No: tap Yes to change it, or No again to take it back.</p>
          </div>
        </section>

        <section>
          <h3 class="section-label">Comments</h3>
          <ul class="kit-group">
            <li class="kit-comment"><p class="kit-comment-meta"><span class="kit-comment-author">Farah</span><span>2 days ago</span><button class="report">Report</button></p><p class="kit-comment-body">The room went up in September, so something has to give. 15 still seems fair for a whole year.</p></li>
            <li class="kit-comment"><p class="kit-comment-meta"><span class="kit-comment-author">Gus</span><span>2 days ago</span><button class="report">Report</button></p><p class="kit-comment-body">Could we do 12 and pass a jar round at the summer event for the rest?</p></li>
            <li class="kit-comment"><p class="kit-comment-meta"><span class="kit-comment-author">You</span><span>yesterday</span></p><p class="kit-comment-body">I'd rather keep it at 10 and look for a cheaper room first.</p></li>
            <li class="kit-comment"><p class="kit-comment-meta"><span class="kit-comment-author">Hana</span><span>5 hours ago</span><button class="report">Report</button></p><p class="kit-comment-body">The community centre quoted half that for Thursday evenings. Worth asking before we decide?</p></li>
          </ul>

            <label class="kit-label">Add a comment</label>
            <div class="field">e.g. I'd vote yes if we kept a hardship discount</div>
            <div class="kit-composer-actions"><button class="btn-secondary" disabled>Post comment</button></div>
