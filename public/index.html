<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>

        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name || v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {

            seen.add(val);

    ['log','info','warn','error','debug'].forEach(function (level) {

  <title>Tier List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23B8402E'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css
       on every image build. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform's native-feel UI kit, centrally hosted, loaded by
       RELATIVE path. Used for the item detail sheet, the tier menu and
       toasts; its accent follows the app's coral via --un-accent. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path. It
       is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, and where the app learns the viewer's
       light/dark theme. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto w-full max-w-xl px-4 pb-16">
    <header class="flex items-center justify-between gap-3 py-4">
      <h1 class="text-title">Tier List</h1>
      <div class="inline-flex rounded-lg border border-line bg-raised p-0.5" role="group" aria-label="Whose tiers">
        <button type="button" id="view-my" aria-pressed="true" class="min-h-11 rounded-md bg-surface px-3 text-small font-semibold text-fg">My tiers</button>
        <button type="button" id="view-crowd" aria-pressed="false" class="min-h-11 rounded-md px-3 text-small font-medium text-muted">Crowd tiers</button>
      </div>
    </header>

    <form id="add-form" class="mb-4 flex gap-2">
      <label for="add-input" class="sr-only">Add something to rank</label>
      <input id="add-input" name="name" type="text" class="field" placeholder="e.g. Tartine Bakery" maxlength="60" autocomplete="off">
      <button type="submit" class="btn-primary">Add</button>
    </form>

    <div id="board" data-view="my"></div>
  </main>

  <script>
  (function () {
    'use strict';

    var TIERS = ['S', 'A', 'B', 'C', 'D', 'F'];
    var TOGGLE_ON = 'min-h-11 rounded-md bg-surface px-3 text-small font-semibold text-fg';
    var TOGGLE_OFF = 'min-h-11 rounded-md px-3 text-small font-medium text-muted';

    var state = {
      phase: 'loading',           // 'loading' | 'ready' | 'error'
      items: [],
      viewerId: null,
      view: new URLSearchParams(location.search).get('view') === 'crowd' ? 'crowd' : 'my',
    };

    var board = document.getElementById('board');
    var addForm = document.getElementById('add-form');
    var addInput = document.getElementById('add-input');
    var myBtn = document.getElementById('view-my');
    var crowdBtn = document.getElementById('view-crowd');

    // ── Small helpers ──────────────────────────────────────────────────
    function kit() { return window.unNative || null; }

    // The platform injects the viewer's token as ?token= on the iframe URL;
    // later API calls forward it via x-usernode-token.
    var TOKEN = new URLSearchParams(location.search).get('token') || '';

    function api(path, opts) {
      opts = opts || {};
      if (TOKEN) {
        opts.headers = Object.assign({}, opts.headers, { 'x-usernode-token': TOKEN });
      }
      return fetch(path, opts);
    }

    function toast(message) {
      var k = kit();
      if (k && k.toast) { k.toast(message); return; }
      var el = document.getElementById('toast-fallback');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast-fallback';
        el.className = 'toast-fallback';
        document.body.appendChild(el);
      }
      el.textContent = message;
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.textContent = ''; }, 2200);
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function itemOf(chip) {
      // Item ids are bigints: the API returns them as strings.
      return state.items.find(function (i) { return String(i.id) === chip.dataset.itemId; }) || null;
    }

    // Which tier an item sits in for the current view; null means the tray.
    function slotFor(item) {
      if (state.view === 'crowd') {
        return item.crowdCount > 0 && item.crowdTier ? item.crowdTier : null;
      }
      return item.myTier;
    }

    // ── Rendering ──────────────────────────────────────────────────────
    function render() {
      board.dataset.view = state.view;
      myBtn.className = state.view === 'my' ? TOGGLE_ON : TOGGLE_OFF;
      myBtn.setAttribute('aria-pressed', state.view === 'my' ? 'true' : 'false');
      crowdBtn.className = state.view === 'crowd' ? TOGGLE_ON : TOGGLE_OFF;
      crowdBtn.setAttribute('aria-pressed', state.view === 'crowd' ? 'true' : 'false');

      if (state.phase === 'loading') { board.replaceChildren.apply(board, loadingRails()); return; }
      if (state.phase === 'error') { board.replaceChildren.apply(board, [errorState()]); return; }
      if (!state.items.length) { board.replaceChildren.apply(board, [emptyState()]); return; }

      var nodes = TIERS.map(railEl);
      nodes.push(trayEl());
      board.replaceChildren.apply(board, nodes);
    }

    function loadingRails() {
      return TIERS.map(function (tier) {
        var rail = el('div', 'tier-rail');
        rail.setAttribute('aria-hidden', 'true');
        rail.appendChild(el('span', 'tier-badge skeleton', tier));
        rail.appendChild(el('span', 'skeleton h-6 w-40 self-center'));
        return rail;
      });
    }

    function errorState() {
      var box = el('div', 'state-error');
      box.appendChild(el('p', 'text-body', 'Could not load the list.'));
      box.appendChild(el('p', 'text-small text-muted', 'Check your connection. Nothing was lost.'));
      var retry = el('button', 'btn-secondary', 'Retry');
      retry.type = 'button';
      retry.addEventListener('click', load);
      box.appendChild(retry);
      return box;
    }

    function emptyState() {
      var box = el('div', 'state-empty');
      box.appendChild(el('p', 'text-body', 'Nothing to rank yet. Add the first thing.'));
      return box;
    }

    function railEl(tier) {
      var rail = el('div', 'tier-rail');
      rail.dataset.drop = tier;
      rail.appendChild(el('span', 'tier-badge', tier));
      var slots = el('div', 'flex flex-1 flex-wrap items-center gap-1.5');
      var placed = state.items.filter(function (i) { return slotFor(i) === tier; });
      placed.forEach(function (item) { slots.appendChild(chipEl(item)); });
      rail.appendChild(slots);
      return rail;
    }

    function trayEl() {
      var box = el('div', 'mt-4');
      box.dataset.drop = 'tray';
      box.appendChild(el('p', 'section-label', 'Not placed yet'));
      var slots = el('div', 'flex flex-wrap items-center gap-1.5');
      var waiting = state.items.filter(function (i) { return slotFor(i) === null; });
      waiting.forEach(function (item) { slots.appendChild(chipEl(item)); });
      box.appendChild(slots);
      if (waiting.length) {
        box.appendChild(el('p', 'mt-2 px-1 text-small text-muted', 'Drag a chip into a tier, or tap it to place.'));
      }
      return box;
    }

    function chipEl(item) {
      var inTray = slotFor(item) === null;
      var chip = el('button', 'chip' + (inTray ? ' chip-tray' : ''));
      chip.type = 'button';
      chip.dataset.itemId = item.id;
      chip.appendChild(document.createTextNode(item.name));
      if (state.view === 'crowd' && item.crowdCount > 0) {
        chip.appendChild(el('span', 'chip-count', String(item.crowdCount)));
      }
      return chip;
    }

    // ── Views and the URL ──────────────────────────────────────────────
    function setView(view) {
      if (state.view === view) return;
      state.view = view;
      var url = new URL(location.href);
      if (view === 'crowd') url.searchParams.set('view', 'crowd');
      else url.searchParams.delete('view');
      history.replaceState(null, '', url);
      render();
    }
    myBtn.addEventListener('click', function () { setView('my'); });
    crowdBtn.addEventListener('click', function () { setView('crowd'); });

    // ── Adding ─────────────────────────────────────────────────────────
    addForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var name = addInput.value.trim();
      if (!name || name.length > 60) { toast('Use 1 to 60 characters'); return; }
      try {
        var res = await api('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.status === 409) { toast('Already on the list'); return; }
        if (res.status === 401 && data.error === 'account_required') { toast('Make an account to continue'); return; }
        if (!res.ok || !data.item) { toast('Could not add that'); return; }
        addInput.value = '';
        state.items.push(data.item);
        toast('Added');
        render();
      } catch (err) {
        toast('Could not add that');
      }
    });

    // ── Placing ────────────────────────────────────────────────────────
    // Saves a placement (tier, or null for the tray). Resolves true when
    // the server accepted it.
    async function savePlacement(item, tier) {
      var ok = false;
      try {
        var res = await api('/api/items/' + item.id + '/placement', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tier: tier }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (res.ok && data.item) {
          replaceItem(data.item);
          ok = true;
        } else if (res.status === 401 && data.error === 'account_required') {
          toast('Make an account to continue');
        } else {
          toast('Could not save that move');
        }
      } catch (err) {
        toast('Could not save that move');
      }
      render();
      return ok;
    }

    function replaceItem(updated) {
      state.items = state.items.map(function (i) { return i.id === updated.id ? updated : i; });
    }

    // ── The detail sheet ───────────────────────────────────────────────
    var activeSheet = null;
    var fallbackSheetEl = null;

    function closeSheet() {
      if (activeSheet) { activeSheet.dismiss(); activeSheet = null; }
      if (fallbackSheetEl) { fallbackSheetEl.remove(); fallbackSheetEl = null; }
    }

    function openSheet(item) {
      if (!item) return;
      closeSheet();
      var content = el('div', 'flex flex-col gap-3 p-4');
      content.appendChild(el('h2', 'text-heading', item.name));
      content.appendChild(el('p', 'text-small text-muted', 'Added by ' + item.createdBy));
      content.appendChild(el('p', 'section-label', 'Placements'));
      var list = el('ul', 'list');
      if (!item.placements.length) {
        list.appendChild(el('li', 'list-row text-small text-muted', 'No placements yet.'));
      } else {
        item.placements
          .slice()
          .sort(function (a, b) { return a.username.localeCompare(b.username); })
          .forEach(function (p) {
            var row = el('li', 'list-row justify-between');
            row.appendChild(el('span', 'text-small', p.username));
            var mine = state.viewerId !== null && p.userId === state.viewerId;
            row.appendChild(el('span', 'tier-pill' + (mine ? ' tier-pill-mine' : ''), p.tier));
            list.appendChild(row);
          });
      }
      content.appendChild(list);
      var place = el('button', 'btn-primary', 'Place it');
      place.type = 'button';
      place.addEventListener('click', function () { pickTier(place, item); });
      content.appendChild(place);

      var k = kit();
      if (k && k.presentSheet) {
        activeSheet = k.presentSheet({ contentEl: content, onDismiss: function () { activeSheet = null; } });
      } else {
        var dim = el('div', 'sheet-fallback');
        var card = el('div', 'sheet-fallback-card');
        card.appendChild(content);
        dim.appendChild(card);
        dim.addEventListener('click', function (e) { if (e.target === dim) closeSheet(); });
        document.body.appendChild(dim);
        fallbackSheetEl = dim;
      }
    }

    function pickTier(anchorEl, item) {
      var k = kit();
      if (k && k.menu) {
        k.menu({
          anchorEl: anchorEl,
          title: 'Pick a tier',
          items: TIERS.map(function (t) { return { label: t, value: t }; }),
        }).then(function (chosen) {
          if (chosen) savePlacement(item, chosen.value).then(function (ok) { if (ok) closeSheet(); });
        });
        return;
      }
      // Fallback when the native kit is unavailable: a row of tier buttons.
      var existing = anchorEl.parentElement && anchorEl.parentElement.querySelector('.tier-menu-fallback');
      if (existing) existing.remove();
      var row = el('div', 'tier-menu-fallback');
      TIERS.forEach(function (t) {
        var b = el('button', 'tier-pill', t);
        b.type = 'button';
        b.addEventListener('click', function () {
          row.remove();
          savePlacement(item, t).then(function (ok) { if (ok) closeSheet(); });
        });
        row.appendChild(b);
      });
      anchorEl.insertAdjacentElement('afterend', row);
    }

    // ── Tap and drag ───────────────────────────────────────────────────
    // Every chip is a button: tap (or Enter) opens the detail sheet.
    // Pointer dragging moves a ghost 1:1 with the finger; on touch the
    // drag lifts on a long-press so scrolling still works, and the drag
    // joins the native kit's gesture arbiter.
    var drag = null;
    var suppressClick = false;

    board.addEventListener('click', function (e) {
      if (suppressClick) return;
      var chip = e.target.closest('.chip');
      if (chip) openSheet(itemOf(chip));
    });

    board.addEventListener('pointerdown', function (e) {
      if (drag || e.pointerType === 'mouse' && e.button !== 0) return;
      var chip = e.target.closest('.chip');
      if (!chip) return;
      var startX = e.clientX;
      var startY = e.clientY;
      var pointerId = e.pointerId;
      var seq = e.pointerType === 'touch' ? 'touch' : String(pointerId);
      var isTouch = e.pointerType === 'touch';
      var timer = null;

      function preCleanup() {
        clearTimeout(timer);
        document.removeEventListener('pointermove', preMove, true);
        document.removeEventListener('pointerup', preUp, true);
        document.removeEventListener('pointercancel', preUp, true);
      }
      function preMove(ev) {
        if (ev.pointerId !== pointerId) return;
        var dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
        if (isTouch) {
          if (dist > 10) preCleanup(); // a scroll, not a drag
        } else if (dist > 6) {
          preCleanup();
          startDrag(chip, ev, seq);
        }
      }
      function preUp(ev) { if (ev.pointerId === pointerId) preCleanup(); }

      document.addEventListener('pointermove', preMove, true);
      document.addEventListener('pointerup', preUp, true);
      document.addEventListener('pointercancel', preUp, true);
      if (isTouch) timer = setTimeout(function () { preCleanup(); startDrag(chip, e, seq); }, 300);
    });

    function startDrag(chip, ev, seq) {
      var g = kit() && kit().gestures;
      if (g && g.claim(seq, 'tierlist') === false) return;
      var rect = chip.getBoundingClientRect();
      var ghost = chip.cloneNode(true);
      ghost.classList.add('drag-ghost');
      ghost.style.width = rect.width + 'px';
      ghost.style.transform = 'translate(' + rect.left + 'px, ' + rect.top + 'px)';
      document.body.appendChild(ghost);
      chip.style.visibility = 'hidden';
      drag = {
        chip: chip,
        item: itemOf(chip),
        ghost: ghost,
        offX: ev.clientX - rect.left,
        offY: ev.clientY - rect.top,
        source: chip.closest('[data-drop]'),
        target: null,
      };
      document.addEventListener('pointermove', onDragMove);
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragCancel);
      // The finger was still through the long-press, so no scroll has
      // started; keep the browser from starting one while the drag moves.
      document.addEventListener('touchmove', preventTouchScroll, { passive: false });
      document.addEventListener('contextmenu', preventEvent);
      moveGhost(ev);
    }

    function preventTouchScroll(e) { e.preventDefault(); }
    function preventEvent(e) { e.preventDefault(); }

    function moveGhost(ev) {
      if (!drag) return;
      drag.ghost.style.transform =
        'translate(' + (ev.clientX - drag.offX) + 'px, ' + (ev.clientY - drag.offY) + 'px)';
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      var zone = hit ? hit.closest('[data-drop]') : null;
      if (drag.target && drag.target !== zone) drag.target.removeAttribute('data-active');
      drag.target = zone;
      if (zone && zone !== drag.source) zone.setAttribute('data-active', 'true');
    }

    function onDragMove(ev) { if (drag) { ev.preventDefault(); moveGhost(ev); } }

    function onDragEnd(ev) {
      if (!drag) return;
      var d = drag;
      cleanupDrag();
      // A drag is not a tap. The click that (may) follow fires before this
      // timeout does, and a drag that fired no click clears the flag here.
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 0);
      var zone = d.target;
      if (!zone || zone === d.source) { render(); return; }
      var tier = zone.dataset.drop === 'tray' ? null : zone.dataset.drop;
      if (tier === slotFor(d.item)) { render(); return; }
      savePlacement(d.item, tier);
    }

    function onDragCancel() {
      if (!drag) return;
      cleanupDrag();
      render();
    }

    function cleanupDrag() {
      var d = drag;
      drag = null;
      document.removeEventListener('pointermove', onDragMove);
      document.removeEventListener('pointerup', onDragEnd);
      document.removeEventListener('pointercancel', onDragCancel);
      document.removeEventListener('touchmove', preventTouchScroll);
      document.removeEventListener('contextmenu', preventEvent);
      if (d.target) d.target.removeAttribute('data-active');
      d.ghost.remove();
      d.chip.style.visibility = '';
    }

    // ── Loading ────────────────────────────────────────────────────────
    async function load() {
      state.phase = 'loading';
      render();
      try {
        var res = await api('/api/items');
        if (!res.ok) throw new Error('load failed');
        var data = await res.json();
        state.items = data.items || [];
        state.viewerId = data.viewerId || null;
        state.phase = 'ready';
      } catch (err) {
        state.phase = 'error';
      }
      render();
    }

    load();
  })();
  </script>
</body>
</html>
