<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23c2410c'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto flex w-full max-w-2xl flex-col gap-4 px-4 py-8">

    <!-- One job: read your feeds. The screen opens on the unread list. -->
    <div class="flex items-center justify-between gap-3">
      <h1 class="text-title font-serif">Unread <span id="unread-count">(0)</span></h1>
      <button id="refresh-btn" type="button" class="btn-secondary">Refresh</button>
    </div>

    <!-- The one primary action. Hidden only when the empty state's own
         invitation carries the Add feed button instead. -->
    <button id="add-feed-btn" type="button" class="btn-primary sm:self-start">Add feed</button>

    <!-- The Add feed form hides behind the Add feed button. -->
    <form id="add-feed-form" hidden class="flex flex-col gap-3" novalidate>
      <div class="flex flex-col gap-1">
        <label for="feed-url" class="px-1 text-small font-medium text-muted">Feed or site URL</label>
        <input id="feed-url" name="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
               class="field" placeholder="e.g. example.com/blog/feed">
      </div>
      <p id="add-feed-error" hidden class="px-1 text-small text-danger"></p>
      <div class="flex gap-3">
        <button type="submit" class="btn-primary">Add</button>
        <button type="button" id="add-feed-cancel" class="btn-secondary">Cancel</button>
      </div>
    </form>

    <!-- A feed that could not be refreshed is named here, one line. -->
    <p id="note" hidden class="px-1 text-small text-muted"></p>

    <!-- The four states of the list. Exactly one shows at a time. -->
    <ul id="skeleton" class="list" aria-hidden="true">
      <li class="list-row items-start">
        <span class="skeleton mt-1.5 h-2.5 w-2.5 flex-none rounded-full"></span>
        <span class="block w-full">
          <span class="skeleton block h-4 w-3/4"></span>
          <span class="skeleton mt-2 block h-3 w-1/3"></span>
        </span>
      </li>
      <li class="list-row items-start">
        <span class="skeleton mt-1.5 h-2.5 w-2.5 flex-none rounded-full"></span>
        <span class="block w-full">
          <span class="skeleton block h-4 w-2/3"></span>
          <span class="skeleton mt-2 block h-3 w-1/4"></span>
        </span>
      </li>
      <li class="list-row items-start">
        <span class="skeleton mt-1.5 h-2.5 w-2.5 flex-none rounded-full"></span>
        <span class="block w-full">
          <span class="skeleton block h-4 w-4/5"></span>
          <span class="skeleton mt-2 block h-3 w-1/3"></span>
        </span>
      </li>
    </ul>

    <div id="error-state" class="state-error" hidden>
      <p class="text-body font-medium">Couldn't load your posts</p>
      <p id="error-message" class="text-small text-muted"></p>
      <p class="text-small text-muted">Adding and managing feeds still work.</p>
      <button id="retry-btn" type="button" class="btn-secondary">Retry</button>
    </div>

    <div id="empty-state" class="state-empty" hidden>
      <p class="text-body font-medium">No feeds yet</p>
      <p class="text-small text-muted">Add a feed to see its unread posts here.</p>
      <button id="empty-add-btn" type="button" class="btn-primary">Add feed</button>
    </div>

    <div id="caught-up" class="state-empty" hidden>
      <p class="text-body font-medium">You're all caught up</p>
      <p class="text-small text-muted">New posts appear here after a refresh.</p>
    </div>

    <ul id="post-list" class="list" hidden></ul>

    <div id="feeds-section" hidden>
      <p class="section-label">My feeds</p>
      <ul id="feed-list" class="list"></ul>
    </div>

    <button id="mark-all-read" type="button" class="btn-secondary sm:self-start" disabled>Mark all read</button>
  </main>

  <script>
  (function () {
    'use strict';

    var pageParams = new URLSearchParams(location.search);
    var DEMO = pageParams.get('demo') === '1';
    var TOKEN = pageParams.get('token') || '';

    var state = {
      loading: true,
      loadError: null,
      posts: [], // unread posts from the server; a locally read one stays in place until the next refresh
      feeds: [],
      note: '',
    };

    function now() {
      return window.usernode && window.usernode.now ? window.usernode.now() : new Date();
    }

    function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers);
      if (TOKEN) opts.headers['x-usernode-token'] = TOKEN;
      if (window.usernode && window.usernode.previewNow) {
        opts.headers['x-usernode-now'] = now().toISOString();
      }
      if (opts.body && typeof opts.body === 'object') {
        opts.body = JSON.stringify(opts.body);
        opts.headers['content-type'] = 'application/json';
      }
      return fetch(path, opts).then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (!res.ok) {
            var err = new Error((data && data.message) || 'Request failed');
            err.status = res.status;
            err.code = data && data.error;
            throw err;
          }
          return data || {};
        });
      });
    }

    // The staging demo route seeds its data behind ?demo=1; carry it on the
    // API calls too. Outside staging the parameter does nothing.
    function withDemo(path) {
      if (!DEMO) return path;
      return path + (path.indexOf('?') === -1 ? '?' : '&') + 'demo=1';
    }

    var el = {};
    ['unread-count', 'refresh-btn', 'add-feed-btn', 'add-feed-form', 'feed-url',
     'add-feed-error', 'add-feed-cancel', 'note', 'skeleton', 'error-state',
     'error-message', 'retry-btn', 'empty-state', 'empty-add-btn', 'caught-up',
     'post-list', 'feeds-section', 'feed-list', 'mark-all-read',
    ].forEach(function (id) { el[id] = document.getElementById(id); });

    // ── loading ────────────────────────────────────────────────────────────
    // Refresh first (so the list is current), then read. A feed that cannot
    // be reached is skipped server-side and named in the note; the list
    // still loads.
    function load() {
      state.loading = true;
      state.loadError = null;
      el['refresh-btn'].disabled = true;
      render();
      var refresh = api(withDemo('/api/feeds/refresh'), { method: 'POST' })
        .then(function (r) { return (r && r.failed) || []; })
        .catch(function (err) {
          // A guest is asked to make an account by the platform; the read
          //-only list still loads below.
          if (err.code === 'account_required') return [];
          return [{ title: 'Some feeds', message: err.message }];
        });
      return refresh.then(function (failed) {
        state.note = failed.map(function (f) { return f.title + ': ' + f.message; }).join(' ');
        return Promise.all([
          api(withDemo('/api/posts')),
          api(withDemo('/api/feeds')),
        ]);
      }).then(function (results) {
        state.posts = results[0].posts || [];
        state.feeds = results[1].feeds || [];
        state.loading = false;
        el['refresh-btn'].disabled = false;
        render();
      }).catch(function (err) {
        state.loading = false;
        state.loadError = err.message || 'Loading failed.';
        el['refresh-btn'].disabled = false;
        render();
      });
    }

    // ── rendering ──────────────────────────────────────────────────────────
    function render() {
      var unread = state.posts.filter(function (p) { return !p.read_at; }).length;
      el['unread-count'].textContent = '(' + unread + ')';

      var showSkeleton = state.loading;
      var showError = !state.loading && !!state.loadError;
      var showEmpty = !state.loading && !state.loadError && state.feeds.length === 0;
      var showCaughtUp = !state.loading && !state.loadError && state.feeds.length > 0 && state.posts.length === 0;
      var showList = !state.loading && !state.loadError && state.posts.length > 0;
      var showFeeds = !state.loading && !state.loadError && state.feeds.length > 0;

      el.skeleton.hidden = !showSkeleton;
      el['error-state'].hidden = !showError;
      el['empty-state'].hidden = !showEmpty;
      el['caught-up'].hidden = !showCaughtUp;
      el['post-list'].hidden = !showList;
      el['feeds-section'].hidden = !showFeeds;
      el['mark-all-read'].hidden = !showFeeds;
      el['mark-all-read'].disabled = unread === 0;
      // The empty state's invitation carries the Add feed button; hide the
      // standalone one so the screen keeps a single primary action.
      el['add-feed-btn'].hidden = showEmpty;

      el.note.hidden = !state.note;
      el.note.textContent = state.note;

      if (showError) el['error-message'].textContent = state.loadError;

      if (showList) {
        el['post-list'].textContent = '';
        state.posts.forEach(function (post) {
          el['post-list'].appendChild(buildPostRow(post));
        });
      }
      if (showFeeds) {
        el['feed-list'].textContent = '';
        state.feeds.forEach(function (feed) {
          el['feed-list'].appendChild(buildFeedRow(feed));
        });
      }
    }

    // Ages: "just now", minutes, hours, days, then the date.
    function ageOf(post) {
      var ts = post.published_at || post.created_at;
      var then = new Date(ts);
      var seconds = Math.floor((now().getTime() - then.getTime()) / 1000);
      if (isNaN(seconds) || seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      if (seconds < 7 * 86400) return Math.floor(seconds / 86400) + 'd ago';
      return then.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }

    function dateOf(post) {
      var then = new Date(post.published_at || post.created_at);
      if (isNaN(then.getTime())) return '';
      return then.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // ── post rows ──────────────────────────────────────────────────────────
    // Feed content is untrusted: everything is inserted with textContent,
    // never innerHTML. The only attribute that carries feed data is the
    // article link, and the server only stores http(s) URLs there.
    function buildPostRow(post) {
      var li = document.createElement('li');

      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'list-row w-full items-start text-left';
      row.setAttribute('aria-expanded', post.open ? 'true' : 'false');

      var dot = document.createElement('span');
      dot.className = post.read_at
        ? 'mt-1.5 h-2.5 w-2.5 flex-none rounded-full border border-line'
        : 'mt-1.5 h-2.5 w-2.5 flex-none rounded-full bg-accent';
      row.appendChild(dot);

      var block = document.createElement('span');
      block.className = 'min-w-0 flex-1';
      var title = document.createElement('span');
      title.className = 'block font-serif text-body font-semibold leading-snug';
      title.textContent = post.title || 'Untitled post';
      var meta = document.createElement('span');
      meta.className = 'mt-0.5 block text-small text-muted';
      meta.textContent = post.feed_title + ', ' + ageOf(post);
      block.appendChild(title);
      block.appendChild(meta);
      row.appendChild(block);
      row.addEventListener('click', function () { togglePost(post); });
      li.appendChild(row);

      if (post.open) {
        var preview = document.createElement('div');
        preview.className = 'px-4 pb-4 pl-8';
        var summary = document.createElement('p');
        summary.className = 'text-body text-muted';
        summary.textContent = post.summary || 'The feed ships no summary for this post.';
        preview.appendChild(summary);
        var when = document.createElement('p');
        when.className = 'mt-2 text-small text-muted';
        when.textContent = 'Posted ' + dateOf(post);
        preview.appendChild(when);
        if (post.url) {
          var link = document.createElement('a');
          link.className = 'mt-2 inline-block text-small font-medium text-accent';
          link.href = post.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Open full article';
          preview.appendChild(link);
        }
        li.appendChild(preview);
      }
      return li;
    }

    function togglePost(post) {
      post.open = !post.open;
      if (post.open && !post.read_at) {
        markRead(post);
      } else {
        render();
      }
    }

    // Opening a preview marks the post read: its dot clears and the row
    // stays put until the next refresh, so it does not jump under the
    // reader's thumb.
    function markRead(post) {
      post.read_at = new Date().toISOString();
      render();
      api('/api/posts/' + post.id + '/read', { method: 'POST' }).catch(function (err) {
        if (err.code === 'account_required') return; // the platform asks them to make an account
        post.read_at = null;
        render();
      });
    }

    function markAllRead() {
      api('/api/posts/read-all', { method: 'POST' }).then(function () {
        state.posts.forEach(function (post) {
          if (!post.read_at) post.read_at = new Date().toISOString();
        });
        render();
      }).catch(function (err) {
        if (err.code === 'account_required') return;
        state.note = 'Mark all read failed: ' + err.message;
        render();
      });
    }

    // ── feed rows ──────────────────────────────────────────────────────────
    function buildFeedRow(feed) {
      var li = document.createElement('li');
      li.className = 'list-row';

      var block = document.createElement('div');
      block.className = 'min-w-0 flex-1';
      var name = document.createElement('p');
      name.className = 'truncate text-body font-medium';
      name.textContent = feed.title;
      var url = document.createElement('p');
      url.className = 'truncate text-small text-muted';
      url.textContent = feed.url;
      block.appendChild(name);
      block.appendChild(url);

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn-secondary';
      remove.textContent = 'Remove';
      remove.addEventListener('click', function () { removeFeed(feed); });

      li.appendChild(block);
      li.appendChild(remove);
      return li;
    }

    // Removing a feed removes its posts with it (cascade) and closes any
    // preview it had open, since the whole list reloads.
    function removeFeed(feed) {
      api('/api/feeds/' + feed.id, { method: 'DELETE' }).then(function () {
        return load();
      }).catch(function (err) {
        if (err.code === 'account_required') return;
        state.note = 'Removing ' + feed.title + ' failed: ' + err.message;
        render();
      });
    }

    // ── add feed ───────────────────────────────────────────────────────────
    function openAddForm() {
      el['add-feed-form'].hidden = false;
      el['add-feed-error'].hidden = true;
      el['feed-url'].focus();
    }

    function closeAddForm() {
      el['add-feed-form'].hidden = true;
      el['add-feed-error'].hidden = true;
      el['feed-url'].value = '';
    }

    function submitAddForm(event) {
      event.preventDefault();
      var url = el['feed-url'].value;
      api('/api/feeds', { method: 'POST', body: { url: url } }).then(function () {
        closeAddForm();
        return load();
      }).catch(function (err) {
        if (err.code === 'account_required') return; // the platform asks them to make an account
        // The specific error shows under the field and what was typed stays.
        el['add-feed-error'].textContent = err.message || 'Adding the feed failed. Try again.';
        el['add-feed-error'].hidden = false;
      });
    }

    el['add-feed-btn'].addEventListener('click', openAddForm);
    el['empty-add-btn'].addEventListener('click', openAddForm);
    el['add-feed-cancel'].addEventListener('click', closeAddForm);
    el['add-feed-form'].addEventListener('submit', submitAddForm);
    el['refresh-btn'].addEventListener('click', load);
    el['retry-btn'].addEventListener('click', load);
    el['mark-all-read'].addEventListener('click', markAllRead);

    load();
  })();
  </script>
</body>
</html>
