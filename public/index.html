<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><circle cx='10' cy='22' r='2.5' fill='%23ffffff'/><path d='M8.5 15.5a8 8 0 0 1 8 8' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/><path d='M8.5 9a14 14 0 0 1 14 14' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- usernode-spec-screens@1: the screens the spec drew. Screen 1 is the
       reader; screen 2, the preview, moved out of its template into the
       overlay it is live. The drawn rows are sample data: app.js renders
       the list from real data with the same markup. -->
  <div data-spec-screen="1">
    <div class="app">
      <div class="hd">
        <div>
          <div class="app-name">RSS Reader</div>
          <h1 class="title" id="unread-title"></h1>
        </div>
        <button class="btn-secondary" id="add-feed-btn">
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 5a14 14 0 0 1 14 14"/><path d="M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1"/></svg>Add feed</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip" id="feeds-chip"><b id="feeds-count"></b><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <span id="refresh-time"></span>
        <button class="chip failed" id="failed-chip" hidden></button>
      </div>
      <p class="section-label" id="list-label">Newest first</p>
      <ul class="list" id="post-list"></ul>
      <div id="state" hidden></div>
    </div>
  </div>

  <!-- Screen 2 as the spec drew it, live: the preview sheet over the list.
       The drawn peek (the count behind the scrim) is the real screen 1
       header now, so only the scrim and the sheet are carried over. -->
  <div data-spec-screen="2" id="preview" hidden>
    <div class="scrim" data-close-preview></div>
    <div class="sheet"><div class="grab"></div>
      <div class="top">
        <div class="meta"><span class="tick" id="preview-tick"></span><span id="preview-meta"></span></div>
        <button class="icon-btn" id="preview-close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      </div>
      <h2 class="sh" id="preview-title"></h2>
      <p class="by" id="preview-by" hidden></p>
      <div class="prose" id="preview-body"></div>
      <button class="btn-primary" id="preview-open">Open full article<svg class="ico" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5H5V6h5"/></svg></button>
      <p class="note" id="preview-note"></p>
    </div>
  </div>

  <!-- The Add feed sheet: the drawn sheet's shell with the kit's field and
       buttons. -->
  <div class="sheet-overlay" id="add-sheet" hidden>
    <div class="scrim" data-close-sheet></div>
    <div class="sheet"><div class="grab"></div>
      <div class="top">
        <h2 class="sh">Add feed</h2>
        <button class="icon-btn" id="add-close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      </div>
      <form id="add-form" novalidate>
        <label class="field-label" for="feed-url">Feed address</label>
        <input class="field" id="feed-url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="e.g. https://example.com/feed.xml">
        <p class="add-error" id="add-error" hidden></p>
        <div class="add-actions">
          <button class="btn-primary" type="submit" id="add-submit">Add feed</button>
          <button class="btn-secondary" type="button" id="add-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- The Feeds sheet: your feeds in the order you added them. -->
  <div class="sheet-overlay" id="feeds-sheet" hidden>
    <div class="scrim" data-close-sheet></div>
    <div class="sheet"><div class="grab"></div>
      <div class="top">
        <h2 class="sh">Your feeds</h2>
        <button class="icon-btn" id="feeds-close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-scroll">
        <p class="add-error" id="feeds-error" hidden></p>
        <ul class="list" id="feeds-list"></ul>
        <p class="feeds-empty" id="feeds-empty" hidden>You follow no feeds yet. Add one with the Add feed button.</p>
      </div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script src="/app.js"></script>
</body>
</html>
