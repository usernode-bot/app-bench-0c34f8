<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Tier List</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1917'/><rect x='14' y='18' width='72' height='18' rx='4' fill='%23b91c1c'/><rect x='14' y='41' width='72' height='18' rx='4' fill='%23c2410c'/><rect x='14' y='64' width='72' height='18' rx='4' fill='%234d7c0f'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div><div class="app">
    <div class="brand">Tier List</div>
    <button type="button" class="picker" id="listPickerBtn" aria-expanded="false" aria-controls="listPanel">
      <span class="picker-name" id="pickerName"><span id="listName">Bay Area restaurants</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
      <span class="skeleton" id="titleSkeleton" hidden style="display:inline-block;width:200px;height:20px"></span>
    </button>
    <div class="sub" id="boardSub"></div>

    <div class="toggle" role="tablist" aria-label="View">
      <div class="on" id="viewMine" role="tab" tabindex="0" aria-selected="true">My view</div>
      <div id="viewCrowd" role="tab" tabindex="0" aria-selected="false">Crowd view</div>
    </div>

    <div class="card" id="listPanel" hidden>
      <div class="ct">Lists</div>
      <div id="listsBox"></div>
      <form id="newListForm" autocomplete="off">
        <div class="section-label">New list</div>
        <label class="cs" for="newListName">List name</label>
        <input class="field" id="newListName" name="listName" type="text" maxlength="80" placeholder="e.g. Movies we argued about">
        <label class="cs" for="newNoun" style="display:block;margin-top:8px">What one thing is called</label>
        <input class="field" id="newNoun" name="noun" type="text" maxlength="40" placeholder="e.g. movie">
        <div class="form-head" style="margin-top:12px">
          <button type="button" class="btn-secondary" id="newListCancel">Cancel</button>
          <button type="submit" class="btn-primary">Start list</button>
        </div>
      </form>
    </div>

    <div class="board" id="board" aria-label="Tier board">
    <div class="row" data-tier="S" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-s))">S</div><div class="items" id="row-S"></div></div>
    <div class="row" data-tier="A" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-a))">A</div><div class="items" id="row-A"></div></div>
    <div class="row" data-tier="B" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-b))">B</div><div class="items" id="row-B"></div></div>
    <div class="row" data-tier="C" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-c))">C</div><div class="items" id="row-C"></div></div>
    <div class="row" data-tier="D" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-d))">D</div><div class="items" id="row-D"></div></div>
    <div class="row" data-tier="F" data-drop="tier"><div class="lab" style="background:rgb(var(--tier-f))">F</div><div class="items" id="row-F"></div></div>
    </div>

    <div id="boardState"></div>

    <div class="section-label" id="trayLabel">Not placed by you yet</div>
    <div class="tray" id="tray" data-drop="tray"></div>

    <form id="addForm" class="card" hidden autocomplete="off">
      <div class="ct">Add a restaurant</div>
      <label class="cs" for="addName">Name</label>
      <input class="field" id="addName" name="name" type="text" maxlength="80" placeholder="e.g. State Bird Provisions" required>
      <div class="add-actions">
        <button type="button" class="btn-secondary" id="addCancel">Cancel</button>
        <button type="submit" class="btn-primary" id="addSubmit">Add</button>
      </div>
    </form>

    <button type="button" class="btn-primary" id="addBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="addBtnLabel">Add a restaurant</span></button>

    <div id="detail"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div></div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script src="/app.js"></script>
</body>
</html>
