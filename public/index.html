<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Club Votes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>">
  <!-- Tailwind, PRECOMPILED for this app. npm run build compiles
       tailwind.config.js + styles/tailwind-input.css to public/tailwind.css
       on every image build, so the stylesheet is regenerated from THIS
       commit's markup and can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and this app ships only the components
       its screens use.) -->
  <main id="app" class="mx-auto flex w-full max-w-md flex-col gap-6 px-4 pb-10 pt-6">

    <header class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-title">Club Votes</h1>
        <p class="text-small text-muted" data-count-line></p>
      </div>
      <button type="button" class="btn-primary shrink-0" data-new>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="h-5 w-5"><path d="M12 5v14M5 12h14"/></svg>
        New decision
      </button>
      <p class="text-small text-muted" data-guest hidden>Sign in to Homeroom to post, vote and comment.</p>
    </header>

    <div id="lists" class="flex flex-col gap-6">
      <section id="open-section" class="flex flex-col">
        <h2 class="section-label">Open</h2>
        <p class="state-empty" id="open-none" hidden>Nothing open right now.</p>
        <ul class="list" id="open-list">
          <li class="un-group-row"><button type="button" class="list-row kit-row decision">
            <span class="row-top">
              <span class="kit-row-title decision-title"></span>
              <span class="badge" data-badge hidden>Your vote needed</span>
              <span class="outcome" data-outcome hidden>
                <svg class="o-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>
                <svg class="o-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                <span class="outcome-text"></span>
              </span>
            </span>
            <span class="kit-row-sub decision-sub"></span>
            <span class="ballot" data-ballot><span class="b-agree"></span><span class="b-disagree"></span><span class="b-abstain"></span></span>
            <span class="decision-meta">
              <span class="k" data-k-agree><i class="dot bg-agree"></i><span data-c-agree></span></span>
              <span class="k" data-k-disagree><i class="dot bg-disagree"></i><span data-c-disagree></span></span>
              <span class="k" data-k-abstain><i class="dot bg-abstain"></i><span data-c-abstain></span></span>
              <span class="no-votes" data-novotes hidden>No votes yet</span>
              <span class="mine" data-mine hidden></span>
              <span class="end">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
                <span data-c-comments></span>
              </span>
            </span>
          </button></li>
        </ul>
      </section>
      <section id="decided-section" class="flex flex-col" hidden>
        <h2 class="section-label">Decided</h2>
        <ul class="list" id="decided-list">
          <li class="un-group-row"><button type="button" class="list-row kit-row decision">
            <span class="row-top">
              <span class="kit-row-title decision-title"></span>
              <span class="badge" data-badge hidden>Your vote needed</span>
              <span class="outcome" data-outcome hidden>
                <svg class="o-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>
                <svg class="o-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                <span class="outcome-text"></span>
              </span>
            </span>
            <span class="kit-row-sub decision-sub"></span>
            <span class="ballot" data-ballot><span class="b-agree"></span><span class="b-disagree"></span><span class="b-abstain"></span></span>
            <span class="decision-meta">
              <span class="k" data-k-agree><i class="dot bg-agree"></i><span data-c-agree></span></span>
              <span class="k" data-k-disagree><i class="dot bg-disagree"></i><span data-c-disagree></span></span>
              <span class="k" data-k-abstain><i class="dot bg-abstain"></i><span data-c-abstain></span></span>
              <span class="no-votes" data-novotes hidden>No votes yet</span>
              <span class="mine" data-mine hidden></span>
              <span class="end">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
                <span data-c-comments></span>
              </span>
            </span>
          </button></li>
        </ul>
      </section>
    </div>
  </main>

  <!-- Screen 2: a decision and its votes and comments. Hidden until a row is
       tapped; app.js lifts it out of this template. -->
  <template data-spec-screen="2">
    <div id="detail-screen" class="mx-auto flex w-full max-w-md flex-col gap-4 px-4 pb-10 pt-4" hidden>
      <button type="button" class="btn-secondary self-start" data-back>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-5 w-5"><path d="M15 5l-7 7 7 7"/></svg>
        Decisions
      </button>
      <div id="detail-body"></div>
    </div>
  </template>

  <!-- The drawn detail screen: cloned as the prototype for every decision's
       detail view. -->
  <template data-spec-screen="2-detail">
    <div class="kit-detail">
      <header class="kit-detail-head">
        <div class="flex w-full items-start justify-between gap-2">
          <h2 class="kit-detail-title text-heading" data-title tabindex="-1"></h2>
          <button type="button" class="kit-icon-button" data-more aria-label="More" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="h-5 w-5"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
        </div>
        <p class="text-small text-muted" data-meta></p>
        <p class="kit-detail-body" data-body hidden></p>
      </header>
      <section class="kit-section">
        <h3 class="section-label">Your vote</h3>
        <div class="ballot ballot-lg" data-ballot><span class="b-agree"></span><span class="b-disagree"></span><span class="b-abstain"></span></div>
        <div class="kit-votes" data-votes></div>
        <p class="kit-vote-summary" data-summary hidden></p>
      </section>
      <div class="card" data-poster hidden>
        <p class="text-small text-muted">You posted this. When the club has settled it, close the vote.</p>
        <button type="button" class="btn-secondary self-start" data-decide>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-5 w-5"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M9 9V6h6v3M9 14h6"/></svg>
          Mark decided
        </button>
      </div>
      <section class="kit-section">
        <h3 class="section-label" data-comments-label>Comments</h3>
        <div data-comments></div>
      </section>
    </div>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
