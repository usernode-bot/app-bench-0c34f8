  (function () {

    function serialize(v, depth) {

        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));

          if (typeof val === 'object' && val !== null) {

            seen.add(val);

  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

      <li class="list-row"><span class="skeleton rounded-full h-2.5 w-2.5"></span><div class="body"><div class="meta sans"><span class="skeleton h-3 w-32"></span></div><div class="skeleton h-4 w-5/6 mt-1"></div><div class="skeleton h-3 w-full mt-2"></div></div></li>
      <li class="list-row"><span class="skeleton rounded-full h-2.5 w-2.5"></span><div class="body"><div class="meta sans"><span class="skeleton h-3 w-24"></span></div><div class="skeleton h-4 w-1/2 mt-1"></div><div class="skeleton h-3 w-5/6 mt-2"></div></div></li>
      </ul>
      <div class="section-label sans">Yesterday</div>
      <ul class="list">
      <li class="list-row"><span class="skeleton rounded-full h-2.5 w-2.5"></span><div class="body"><div class="meta sans"><span class="skeleton h-3 w-28"></span></div><div class="skeleton h-4 w-2/3 mt-1"></div><div class="skeleton h-3 w-full mt-2"></div></div></li>
      <li class="list-row"><span class="skeleton rounded-full h-2.5 w-2.5"></span><div class="body"><div class="meta sans"><span class="skeleton h-3 w-24"></span></div><div class="skeleton h-4 w-3/4 mt-1"></div><div class="skeleton h-3 w-2/3 mt-2"></div></div></li>
      <li class="list-row"><span class="skeleton rounded-full h-2.5 w-2.5"></span><div class="body"><div class="meta sans"><span class="skeleton h-3 w-28"></span></div><div class="skeleton h-4 w-5/6 mt-1"></div><div class="skeleton h-3 w-full mt-2"></div></div></li>
      </ul>
    </div>
    <div class="state-empty sans" id="empty-feeds" hidden>
      <p>No feeds yet. Add the address of a site's feed and its new posts show up here.</p>
      <button class="btn-primary" id="empty-add" type="button">Add feed</button>
    </div>
    <div class="state-empty sans" id="empty-caughtup" hidden>
      <p id="caughtup-text"></p>
    </div>
    <div class="state-error sans" id="error-state" hidden>
      <p>Couldn't load your posts. Your feeds are still saved.</p>

    <div id="groups"></div>
    </div>
  </div>
  <!-- One drawn row, kept as the shape every rendered row copies. -->
  <template id="row-tpl">
    <li class="list-row"><span class="dot"></span><div class="body"><div class="meta sans"><span class="badge"><svg viewBox="0 0 24 24"><path d="M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1.5"/></svg><span class="feed-name"></span></span><span class="time"></span></div><div class="h"></div><div class="ex sans"></div></div></li>
  </template>
  <!-- Screen 2 as the spec drew it: the post preview sheet, plus the two
       sheets the app also needs (Add feed, Feeds). One overlay, one sheet at
       a time. -->
  <div data-spec-screen="2" id="overlay" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet-preview" hidden>
      <div class="grab"></div>
      <div class="bar"><button class="btn-icon" id="preview-close" aria-label="Close" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="meta sans"><span class="badge"><svg viewBox="0 0 24 24"><path d="M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1.5"/></svg><span id="preview-feed"></span></span><span class="time" id="preview-time"></span></div>
      <div class="h" id="preview-title"></div>
      <div class="summary" id="preview-summary"></div>
      <div class="note sans" id="preview-note">This is the summary the feed shares. The full article is on the site.</div>
      <button class="btn-primary sans" id="preview-open" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open full article</button>
    </div>
    <div class="sheet" id="sheet-add" hidden>
      <div class="grab"></div>
      <div class="bar bar-form">
        <button class="btn-secondary sans" id="add-cancel" type="button">Cancel</button>
        <div class="bar-title sans">Add feed</div>
        <button class="btn-primary sans" id="add-submit" type="button">Add</button>
      </div>
      <label class="field-label sans" for="add-url">Feed address</label>
      <input class="field sans" id="add-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="e.g. https://example.com/feed.xml">
      <div class="form-note sans" id="add-error" hidden></div>
    </div>
    <div class="sheet" id="sheet-feeds" hidden>
      <div class="grab"></div>
      <div class="bar"><div class="bar-title sans">Feeds</div><button class="btn-icon" id="feeds-close" aria-label="Close" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <ul class="list" id="feeds-list"></ul>
    </div>

  <!-- /usernode-spec-screens@1 -->
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1' ? '1' : '';
    var RSS_SVG = '<svg viewBox="0 0 24 24"><path d="M5 5a14 14 0 0 1 14 14M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1.5"/></svg>';

    var state = { posts: [], feedCount: 0, failedFeeds: [], updatedAt: null, demo: false };

    var el = function (id) { return document.getElementById(id); };
    var els = {
      addBtn: el('add-btn'), feedsBtn: el('feeds-btn'), sub: el('sub'), subSkeleton: el('sub-skeleton'),
      loading: el('loading-state'), groups: el('groups'),
      emptyFeeds: el('empty-feeds'), emptyAdd: el('empty-add'),
      emptyCaughtup: el('empty-caughtup'), caughtupText: el('caughtup-text'),
      errorState: el('error-state'), retryBtn: el('retry-btn'),
      overlay: el('overlay'), scrim: el('scrim'),
      sheetPreview: el('sheet-preview'), sheetAdd: el('sheet-add'), sheetFeeds: el('sheet-feeds'),
      previewClose: el('preview-close'), previewFeed: el('preview-feed'),
      previewTime: el('preview-time'), previewTitle: el('preview-title'),
      previewSummary: el('preview-summary'), previewNote: el('preview-note'), previewOpen: el('preview-open'),
      addCancel: el('add-cancel'), addSubmit: el('add-submit'), addUrl: el('add-url'), addError: el('add-error'),
      feedsClose: el('feeds-close'), feedsList: el('feeds-list'),
      rowTpl: el('row-tpl'),
    };

    function api(path, opts) {
      opts = opts || {};
      var url = new URL(path, location.origin);
      if (DEMO) url.searchParams.set('demo', '1');
      var headers = {};
      if (opts.body) headers['content-type'] = 'application/json';
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      return fetch(url.toString(), Object.assign({}, opts, { headers: headers }));
    }

    // ── Times ────────────────────────────────────────────────────────────
    function clock(d) {
      // A non-breaking space keeps "6:04 pm" from wrapping the pm onto its own line.
      return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', ' ');
    }
    function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
    function rowTime(d) {
      var mins = Math.round((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      var h = Math.floor(mins / 60);
      if (h < 12) return h + ' h ago';
      return d.toLocaleDateString([], { weekday: 'short' }) + ', ' + clock(d);
    }
    function dayPrefix(d) {
      var now = new Date();
      var y = new Date(now.getTime() - 86400000);
      if (dayKey(d) === dayKey(now)) return 'Today';
      if (dayKey(d) === dayKey(y)) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function groupLabel(d) { return dayPrefix(d); }
    function previewTime(d) { return dayPrefix(d) + ', ' + clock(d); }

    function subtitle() {
      var n = state.posts.length;
      var s = n + ' new from ' + state.feedCount + (state.feedCount === 1 ? ' feed' : ' feeds') +
        ', updated ' + clock(new Date(state.updatedAt));
      if (state.demo) s = 'Staging demo, ' + s;
      if (state.failedFeeds.length) {
        var names = state.failedFeeds.join(', ').replace(/, ([^,]*)$/, ' and $1');
        s += '. ' + names + (state.failedFeeds.length === 1 ? ' could' : ' could') + ' not be updated';
      }
      return s;
    }

    // ── Sheets ───────────────────────────────────────────────────────────
    var SHEETS = ['sheet-preview', 'sheet-add', 'sheet-feeds'];
    function openSheet(id) {
      SHEETS.forEach(function (s) { el(s).hidden = s !== id; });
      els.overlay.hidden = false;
    }
    function closeOverlay() { els.overlay.hidden = true; }
    els.scrim.addEventListener('click', closeOverlay);
    els.previewClose.addEventListener('click', closeOverlay);
    els.feedsClose.addEventListener('click', closeOverlay);
    els.addCancel.addEventListener('click', closeOverlay);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !els.overlay.hidden) closeOverlay();
    });

    // ── Preview (screen 2) ───────────────────────────────────────────────
    function openPreview(post) {
      els.previewFeed.textContent = post.feedTitle;
      els.previewTime.textContent = previewTime(new Date(post.publishedAt));
      els.previewTitle.textContent = post.title;
      els.previewSummary.innerHTML = '';
      var paras = (post.summary || '').split(/\n+/).filter(Boolean);
      els.previewSummary.hidden = !paras.length;
      els.previewNote.hidden = !paras.length;
      paras.forEach(function (t) {
        var p = document.createElement('p');
        p.textContent = t;
        els.previewSummary.appendChild(p);
      });
      els.previewOpen.hidden = !post.link;
      els.previewOpen.onclick = function () {
        if (post.link) window.open(post.link, '_blank', 'noopener');
      };
      openSheet('sheet-preview');
    }

    // ── The unread list (screen 1) ───────────────────────────────────────
    function markRead(post, li) {
      if (post.read) return;
      post.read = true;
      if (li) {
        li.classList.add('rd');
        var dot = li.querySelector('.dot');
        if (dot) dot.classList.add('read');
      }
      api('/api/posts/' + post.id + '/read', { method: 'POST' }).catch(function () {});
    }

    function buildRow(post) {
      var li = els.rowTpl.content.querySelector('li').cloneNode(true);
      li.querySelector('.feed-name').textContent = post.feedTitle;
      li.querySelector('.time').textContent = rowTime(new Date(post.publishedAt));
      li.querySelector('.h').textContent = post.title;
      li.querySelector('.ex').textContent = post.summary || '';
      if (post.read) {
        li.classList.add('rd');
        li.querySelector('.dot').classList.add('read');
      }
      li.setAttribute('tabindex', '0');
      li.setAttribute('role', 'button');
      function activate() {
        openPreview(post);
        markRead(post, li);
      }
      li.addEventListener('click', activate);
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
      return li;
    }

    function renderGroups() {
      els.groups.innerHTML = '';
      var lastKey = null, list = null;
      state.posts.forEach(function (post) {
        var d = new Date(post.publishedAt);
        var key = dayKey(d);
        if (key !== lastKey) {
          var label = document.createElement('div');
          label.className = 'section-label sans';
          label.textContent = groupLabel(d);
          els.groups.appendChild(label);
          list = document.createElement('ul');
          list.className = 'list';
          els.groups.appendChild(list);
          lastKey = key;
        }
        list.appendChild(buildRow(post));
      });
    }

    function hideStates() {
      els.sub.hidden = true;
      els.subSkeleton.hidden = true;
      els.loading.hidden = true;
      els.emptyFeeds.hidden = true;
      els.emptyCaughtup.hidden = true;
      els.errorState.hidden = true;
      els.groups.innerHTML = '';
    }

    function showLoading() {
      hideStates();
      els.subSkeleton.hidden = false;
      els.loading.hidden = false;
    }

    function showError() {
      hideStates();
      els.errorState.hidden = false;
    }

    function render() {
      hideStates();
      els.addBtn.hidden = state.feedCount === 0;
      if (state.feedCount === 0) {
        els.emptyFeeds.hidden = false;
        return;
      }
      if (!state.posts.length) {
        var n = state.feedCount;
        var msg = "You're all caught up. Nothing new in your " + n + (n === 1 ? ' feed.' : ' feeds.');
        if (state.failedFeeds.length) {
          var names = state.failedFeeds.join(', ').replace(/, ([^,]*)$/, ' and $1');
          msg += ' ' + names + ' could not be updated.';
        }
        els.caughtupText.textContent = msg;
        els.emptyCaughtup.hidden = false;
        return;
      }
      els.sub.hidden = false;
      els.sub.textContent = subtitle();
      renderGroups();
    }

    async function load() {
      showLoading();
      try {
        var r = await api('/api/posts');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var data = await r.json();
        state.posts = data.posts || [];
        state.feedCount = data.feedCount || 0;
        state.failedFeeds = data.failedFeeds || [];
        state.updatedAt = data.updatedAt;
        state.demo = !!data.demo;
        render();
      } catch (err) {
        showError();
      }
    }

    // ── Add feed ─────────────────────────────────────────────────────────
    function openAdd() {
      els.addError.hidden = true;
      els.addError.textContent = '';
      openSheet('sheet-add');
      els.addUrl.focus();
    }
    function showAddError(msg) {
      els.addError.textContent = msg;
      els.addError.hidden = false;
    }
    els.addBtn.addEventListener('click', openAdd);
    els.emptyAdd.addEventListener('click', openAdd);
    els.addSubmit.addEventListener('click', async function () {
      var url = els.addUrl.value.trim();
      if (!url) { showAddError('Enter a feed address.'); return; }
      els.addSubmit.disabled = true;
      try {
        var r = await api('/api/feeds', { method: 'POST', body: JSON.stringify({ url: url }) });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) { showAddError(data.error || 'Could not add that feed.'); return; }
        els.addUrl.value = '';
        closeOverlay();
        await load();
      } catch (err) {
        showAddError('Could not add that feed. Check the address and try again.');
      } finally {
        els.addSubmit.disabled = false;
      }
    });

    // ── Feeds ────────────────────────────────────────────────────────────
    var feedsCache = [];
    var confirmRemoveId = null;

    function renderFeeds() {
      els.feedsList.innerHTML = '';
      if (!feedsCache.length) {
        var li = document.createElement('li');
        li.className = 'list-row';
        var span = document.createElement('span');
        span.className = 'sans text-small text-muted';
        span.textContent = 'No feeds yet.';
        li.appendChild(span);
        els.feedsList.appendChild(li);
        return;
      }
      feedsCache.forEach(function (f) {
        var li = document.createElement('li');
        li.className = 'list-row';
        var info = document.createElement('div');
        info.className = 'flex-1 min-w-0';
        var name = document.createElement('div');
        name.className = 'feed-name sans';
        name.textContent = f.title;
        var url = document.createElement('div');
        url.className = 'feed-url sans';
        url.textContent = f.url;
        info.appendChild(name);
        info.appendChild(url);
        li.appendChild(info);
        if (confirmRemoveId === f.id) {
          li.classList.add('confirm');
          var q = document.createElement('span');
          q.className = 'confirm-q sans';
          q.textContent = 'Remove this feed and its posts?';
          var keep = document.createElement('button');
          keep.className = 'btn-secondary sans';
          keep.type = 'button';
          keep.textContent = 'Keep';
          keep.addEventListener('click', function () {
            confirmRemoveId = null;
            renderFeeds();
          });
          var remove = document.createElement('button');
          remove.className = 'btn-primary sans';
          remove.type = 'button';
          remove.textContent = 'Remove';
          remove.addEventListener('click', async function () {
            remove.disabled = true;
            try {
              await api('/api/feeds/' + f.id, { method: 'DELETE' });
              confirmRemoveId = null;
              await openFeeds();
              await load();
            } catch (err) {}
          });
          li.appendChild(q);
          li.appendChild(keep);
          li.appendChild(remove);
        } else {
          var removeBtn = document.createElement('button');
          removeBtn.className = 'btn-secondary sans';
          removeBtn.type = 'button';
          removeBtn.textContent = 'Remove';
          removeBtn.addEventListener('click', function () {
            confirmRemoveId = f.id;
            renderFeeds();
          });
          li.appendChild(removeBtn);
        }
        els.feedsList.appendChild(li);
      });
    }

    async function openFeeds() {
      openSheet('sheet-feeds');
      els.feedsList.innerHTML = '';
      var li = document.createElement('li');
      li.className = 'list-row';
      var bar = document.createElement('span');
      bar.className = 'skeleton h-4 w-40';
      li.appendChild(bar);
      els.feedsList.appendChild(li);
      try {
        var r = await api('/api/feeds');
        var data = await r.json();
        feedsCache = data.feeds || [];
      } catch (err) {
        feedsCache = [];
      }
      renderFeeds();
    }
    els.feedsBtn.addEventListener('click', openFeeds);

    // ── Start ────────────────────────────────────────────────────────────
    els.retryBtn.addEventListener('click', load);
    load();
  })();
  </script>
</body>
</html>
