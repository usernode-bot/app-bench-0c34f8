  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return String(val);
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Club Votes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b23a1e'/><rect x='30' y='38' width='40' height='10' rx='4' fill='white'/><rect x='30' y='54' width='40' height='10' rx='4' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

<body class="min-h-screen bg-ground text-fg">
  <!-- The app's one centred column; every view renders inside it. -->
  <div data-spec-screen="1"><div class="app" id="app"></div></div>

  <script>
  // ── Club Votes ──────────────────────────────────────────────────────────
  // One list of the club's decisions: anyone posts a question with
  // choices, everyone votes with one tap and can change it until the
  // poster closes the vote, and each decision has its own comments.
  // Views: #/ the list, #/d/:id a decision with its comments, #/new post
  // one. The iframe token rides on every API call as x-usernode-token.
  (function () {
    'use strict';

    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1';

    function api(path, opts) {
      opts = opts || {};
      var headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      var url = path;
      if (DEMO) url += (url.indexOf('?') === -1 ? '?' : '&') + 'demo=1';
      return fetch(url, {
        method: opts.method || 'GET',
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      }).then(function (resp) {
        return resp.json().catch(function () { return {}; }).then(function (data) {
          if (!resp.ok) {
            var err = new Error(data.error || 'request_failed');
            err.status = resp.status;
            err.code = data.error || 'request_failed';
            throw err;
          }
          return data;
        });
      });
    }

    var app = document.getElementById('app');

    var state = {
      decisions: null,      // null = loading
      listFailed: false,
      memberCount: null,    // null = member list unavailable
      viewer: null,
      detail: null,         // { decision, comments }
      detailFailed: null,   // 'failed' | 'missing'
      voteErrors: {},       // decision id -> true (an inline line, not a toast)
      commentError: false,
      commentReported: {},  // comment id -> true
      decisionReported: false,
      now: Date.now(),
    };

    // ── small helpers ─────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function relTime(iso) {
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var min = Math.max(0, Math.round((state.now - t) / 60000));
      if (min < 1) return 'just now';
      if (min < 60) return min + ' min ago';
      var h = Math.round(min / 60);
      if (h < 24) return 'today';
      var d = Math.round(min / 1440);
      if (d === 1) return 'yesterday';
      if (d < 7) return d + ' days ago';
      var dt = new Date(t);
      return dt.getDate() + ' ' + MONTHS[dt.getMonth()];
    }
    function shortDate(iso) {
      var t = new Date(iso);
      if (isNaN(t.getTime())) return '';
      return t.getDate() + ' ' + MONTHS[t.getMonth()];
    }

    // The tally strip: one mark per member, struck fives. With the member
    // count, the strip is the whole club and the marks nobody has cast yet
    // sit empty; without it, only the filled marks show.
    function tally(voters, total) {
      var count = total == null ? voters : Math.max(total, voters);
      var groups = [];
      var left = count, filledLeft = voters;
      while (left > 0) {
        var n = Math.min(5, left);
        var filled = Math.min(n, filledLeft);
        filledLeft -= filled;
        var html = '';
        for (var i = 0; i < filled; i++) html += '<i></i>';
        for (var e = 0; e < n - filled; e++) html += '<i class="e"></i>';
        if (n === 5) html += '<i class="x"></i>';
        groups.push('<span class="g">' + html + '</span>');
        left -= n;
      }
      if (!groups.length) groups.push('<span class="g"></span>');
      return groups.join('');
    }

    // The votes count against the club when the member list came through;
    // otherwise the card says only how many voted.
    function votesText(d, viewer) {
      if (d.voters === 0) return 'No votes yet';
      if (state.memberCount == null) return d.voters + ' voted';
      return d.voters + ' of ' + state.memberCount + ' voted';
    }

    // Tied when two or more choices share the lead.
    function winners(d) {
      var max = 0;
      d.choices.forEach(function (c) { max = Math.max(max, c.votes); });
      var tied = d.choices.filter(function (c) { return c.votes === max && max > 0; });
      return { max: max, tied: tied.length > 1, ids: tied.map(function (c) { return c.id; }) };
    }

    // ── list view ─────────────────────────────────────────────────────────
    function cardHTML(d) {
      var viewer = state.viewer;
      var mine = !!(viewer && d.mine);
      var closed = !!d.closed_at;
      var w = closed ? winners(d) : null;
      var badge = closed ? '<span class="badge">' + (w.tied ? 'Tied' : 'Decided') + '</span>' : '';

      var meta = '<div class="meta"><span>Posted by ' + (mine ? 'you' : esc(d.author_name)) +
        ', ' + relTime(d.created_at) + '</span>' +
        (closed ? badge : '<span>' + (mine ? 'You close it' : esc(d.author_name) + ' closes it') + '</span>') +
        '</div>';

      var opts = d.choices.map(function (c) {
        var pct = d.voters ? Math.round((c.votes / d.voters) * 100) : 0;
        var mineVote = viewer && d.my_choice_id === c.id;
        var count = c.votes + (mineVote ? ', your vote' : '');
        if (closed) {
          var win = w.ids.indexOf(c.id) !== -1 ? ' win' : '';
          return '<div class="opt' + win + '"><b>' + esc(c.label) + '</b><span>' +
            c.votes + (c.votes === 1 ? ' vote' : ' votes') + '</span></div>';
        }
        var cls = 'opt' + (mineVote ? ' me' : '');
        var action = viewer ? ' data-action="vote" data-decision="' + d.id + '" data-choice="' + c.id + '"' : '';
        return '<button class="' + cls + '"' + action + (viewer ? '' : ' disabled') + '>' +
          '<em style="width:' + pct + '%"></em><b>' + esc(c.label) + '</b><span>' + count + '</span></button>';
      }).join('');

      var voteError = state.voteErrors[d.id]
        ? '<p class="sub" style="color:rgb(var(--danger))">Your vote didn\'t save. Try again.</p>'
        : '';

      var link = '<a href="#/d/' + d.id + '"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>' +
        (d.comments_count === 0 ? 'No comments yet' : d.comments_count + (d.comments_count === 1 ? ' comment' : ' comments')) + '</a>';

      var closeBtn = mine && !closed
        ? '<button class="btn-secondary" style="width:100%;margin-top:4px" data-action="close" data-decision="' + d.id + '">Close vote</button>'
        : '';

      return '<div class="card' + (closed ? ' closed' : '') + '">' + meta +
        '<div class="q">' + esc(d.question) + '</div>' +
        '<div class="tally">' + tally(d.voters, closed || state.memberCount != null ? state.memberCount : null) + '</div>' +
        opts + voteError +
        '<div class="foot"><span>' + votesText(d, viewer) + '</span>' + link + '</div>' +
        closeBtn + '</div>';
    }

    function skeletonCard() {
      return '<div class="card">' +
        '<div class="meta"><span class="skeleton" style="display:block;width:45%;height:14px"></span>' +
        '<span class="skeleton" style="display:block;width:26%;height:14px"></span></div>' +
        '<div class="skeleton" style="width:80%;height:22px;margin:6px 0 14px"></div>' +
        '<div class="skeleton" style="width:55%;height:22px;margin-bottom:14px"></div>' +
        '<div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;border-radius:8px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;border-radius:8px"></div>' +
        '</div>';
    }

    function headerHTML(openCount, hideNew) {
      var sub;
      if (state.listFailed) {
        sub = ''; // no count until the list has actually loaded
      } else if (state.decisions === null) {
        // Loading: a bar where the count lands, so nothing moves when it does.
        sub = '<span class="skeleton" style="display:block;width:170px;height:14px"></span>';
      } else {
        sub = openCount + ' open ' + (openCount === 1 ? 'decision' : 'decisions') +
          (state.memberCount != null ? ', ' + state.memberCount + ' members' : '');
      }
      var demoNote = DEMO
        ? '<p class="sub" data-usernode-demo-note style="padding:0 4px">Staging demo: made-up club decisions</p>'
        : '';
      var plus = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
      var btn;
      if (hideNew) btn = '';
      else if (state.viewer) {
        btn = '<button class="btn-primary" data-action="go-new">' + plus + 'New decision</button>';
      } else {
        // Loading or failed: a disabled stand-in keeps the header row steady.
        btn = '<button class="btn-primary" disabled aria-hidden="true">' + plus + 'New decision</button>';
      }
      return '<div class="top"><div style="flex:1;min-width:0"><div class="title">Club Votes</div>' +
        '<div class="sub">' + sub + '</div></div>' + btn + '</div>' + demoNote;
    }

    function listHTML() {
      var open = (state.decisions || []).filter(function (d) { return !d.closed_at; });
      var decided = (state.decisions || []).filter(function (d) { return d.closed_at; });
      var html = headerHTML(open.length);

      if (state.listFailed) {
        // The load failed: no skeletons and no count — the error block and
        // Retry instead. Retry runs loadList, which clears this flag.
        return headerHTML(0) +
          '<div class="state-error" style="margin-top:48px">' +
          '<p style="font-size:16px;line-height:24px">Couldn\'t load the club\'s decisions.</p>' +
          '<button class="btn-secondary" data-action="retry">Retry</button></div>';
      }
      if (state.decisions === null) {
        return html + '<div class="section-label">Open now</div>' +
          skeletonCard() + skeletonCard() + skeletonCard();
      }
      if (!state.decisions.length) {
        return headerHTML(0, true) +
          '<div class="state-empty" style="margin-top:48px">' +
          '<p class="q" style="font-size:18px;margin:0">No decisions yet.</p>' +
          '<p class="sub">Post the first thing the club needs to decide.</p>' +
          (state.viewer
            ? '<button class="btn-primary" data-action="go-new" style="margin-top:16px">Post the first decision</button>'
            : '<p class="sub">Make an account to post one.</p>') +
          '</div>';
      }

      html += '<div class="section-label">Open now</div>';
      if (!open.length) {
        html += '<p class="sub" style="padding:0 4px">Nothing open right now. The club\'s latest decisions are below.</p>';
      }
      html += open.map(cardHTML).join('');

      if (decided.length) {
        html += '<div class="section-label">Decided</div>' + decided.map(cardHTML).join('');
      }
      return html;
    }

    // ── detail view ───────────────────────────────────────────────────────
    function commentRowHTML(c) {
      var viewer = state.viewer;
      var btn;
      if (!viewer) btn = '';
      else if (c.mine) btn = '<button data-action="delete-comment" data-comment="' + c.id + '">Delete</button>';
      else if (state.commentReported[c.id]) btn = '<button disabled>Reported, thanks</button>';
      else btn = '<button data-action="report-comment" data-comment="' + c.id + '">Report</button>';
      return '<div class="list-row"><div class="who"><span><b>' +
        (c.mine ? 'You' : esc(c.author_name)) + '</b>, ' + relTime(c.created_at) + '</span>' + btn +
        '</div><p>' + esc(c.body) + '</p></div>';
    }

    function detailHTML() {
      var d = state.detail && state.detail.decision;
      if (state.detailFailed === 'missing') {
        return '<div class="bar"><button class="icon-btn" data-action="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button></div>' +
          '<div class="state-error"><p class="q" style="font-size:18px;margin:0">That decision isn\'t there anymore.</p>' +
          '<p class="sub">It may have been deleted by whoever posted it.</p></div>';
      }
      if (state.detailFailed === 'failed' || !d) {
        return '<div class="bar"><button class="icon-btn" data-action="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button></div>' +
          '<div class="state-error"><p class="q" style="font-size:18px;margin:0">Couldn\'t load this decision.</p>' +
          '<p class="sub">The club\'s other decisions are still there.</p>' +
          '<button class="btn-secondary" data-action="retry-detail">Retry</button></div>';
      }

      var viewer = state.viewer;
      var mine = !!(viewer && d.mine);
      var closed = !!d.closed_at;
      var w = closed ? winners(d) : null;
      var badge = closed ? '<span class="badge">' + (w.tied ? 'Tied' : 'Decided') + '</span>' : '';

      var meta = '<div class="meta"><span>Posted by ' + (mine ? 'you' : esc(d.author_name)) +
        ', ' + relTime(d.created_at) + '</span>' +
        (closed ? badge : '<span>' + (mine ? 'You close it' : esc(d.author_name) + ' closes it') + '</span>') +
        '</div>';

      var opts = d.choices.map(function (c) {
        var pct = d.voters ? Math.round((c.votes / d.voters) * 100) : 0;
        var mineVote = viewer && d.my_choice_id === c.id;
        var count = c.votes + (mineVote ? ', your vote' : '');
        if (closed) {
          var win = w.ids.indexOf(c.id) !== -1 ? ' win' : '';
          return '<div class="opt' + win + '"><b>' + esc(c.label) + '</b><span>' +
            c.votes + (c.votes === 1 ? ' vote' : ' votes') + '</span></div>';
        }
        var cls = 'opt' + (mineVote ? ' me' : '');
        var action = viewer ? ' data-action="vote-detail" data-decision="' + d.id + '" data-choice="' + c.id + '"' : '';
        return '<button class="' + cls + '"' + action + (viewer ? '' : ' disabled') + '>' +
          '<em style="width:' + pct + '%"></em><b>' + esc(c.label) + '</b><span>' + count + '</span></button>';
      }).join('');

      var sub;
      if (closed) {
        sub = votesText(d) + (w.tied ? '. It was tied.' : '');
      } else if (!viewer) {
        sub = votesText(d) + '.';
      } else if (d.my_choice_id) {
        sub = votesText(d) + '. Tap another choice to change your vote.';
      } else {
        sub = votesText(d) + '. Tap a choice to vote.';
      }

      var voteError = state.voteErrors['d' + d.id]
        ? '<p class="sub" style="color:rgb(var(--danger))">Your vote didn\'t save. Try again.</p>'
        : '';

      var authorRow = '';
      if (mine) {
        var closeBtn = !closed
          ? '<button class="btn-secondary" style="flex:1" data-action="close-detail" data-decision="' + d.id + '">Close vote</button>'
          : '';
        var delBtn = '<button class="btn-secondary" style="flex:1;color:rgb(var(--danger))" data-action="delete-decision" data-decision="' + d.id + '">Delete decision</button>';
        authorRow = '<div style="display:flex;gap:8px;margin-top:12px">' + closeBtn + delBtn + '</div>';
      }

      var reportBtn = viewer
        ? (state.decisionReported
          ? '<button class="icon-btn" disabled>Reported, thanks</button>'
          : '<button class="icon-btn" data-action="report-decision" data-decision="' + d.id + '" aria-label="Report this decision">Report</button>')
        : '';

      var comments = state.detail.comments;
      var commentError = state.commentError
        ? '<p class="sub" style="color:rgb(var(--danger))">Your comment didn\'t post. Try again.</p>'
        : '';
      var commentForm = viewer
        ? '<label class="lbl" for="comment-body">Your comment</label>' +
          '<textarea class="field" id="comment-body" placeholder="e.g. I can bring snacks"></textarea>' +
          commentError +
          '<div style="display:flex;justify-content:flex-end;margin-top:8px">' +
          '<button class="btn-primary" data-action="post-comment" data-decision="' + d.id + '">Post comment</button></div>'
        : '<p class="sub" style="margin-top:12px">Make an account to comment.</p>';

      return '<div class="bar"><button class="icon-btn" data-action="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button>' +
        reportBtn + '</div>' +
        '<div class="card' + (closed ? ' closed' : '') + '">' + meta +
        '<div class="q">' + esc(d.question) + '</div>' +
        '<div class="tally">' + tally(d.voters, closed || state.memberCount != null ? state.memberCount : null) + '</div>' +
        opts + '<p class="sub">' + esc(sub) + '</p>' + voteError + authorRow + '</div>' +
        '<div class="section-label">' +
        (comments.length === 0 ? 'No comments yet' : comments.length + (comments.length === 1 ? ' comment' : ' comments')) +
        '</div>' +
        (comments.length
          ? '<div class="list">' + comments.map(commentRowHTML).join('') + '</div>'
          : '') +
        commentForm;
    }

    // ── new decision view ─────────────────────────────────────────────────
    var CHOICE_EXAMPLES = ['e.g. Library courtyard', 'e.g. Fenwick Park', 'e.g. Cafe on Mill Street'];
    function choiceRowHTML(value, index) {
      return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
        '<input class="field choice-input" style="flex:1;min-height:44px" value="' + esc(value) + '" placeholder="' + CHOICE_EXAMPLES[index % CHOICE_EXAMPLES.length] + '" maxlength="80" aria-label="Choice ' + (index + 1) + '">' +
        '<button class="icon-btn" data-action="remove-choice" aria-label="Remove this choice" style="color:rgb(var(--muted))">' +
        '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
    }

    function newHTML() {
      var rows = (state.formChoices || ['', '']).map(choiceRowHTML).join('');
      return '<div class="bar"><button class="icon-btn" data-action="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button></div>' +
        '<h1 class="q" style="margin:4px 0 0">New decision</h1>' +
        '<label class="lbl" for="new-question">Question</label>' +
        '<input class="field" id="new-question" style="min-height:44px" placeholder="e.g. Where do we meet on Saturday?" maxlength="200">' +
        '<div class="section-label">Choices</div>' +
        '<p class="sub" style="padding:0 4px;margin-bottom:8px">Two or more. Members tap one to vote.</p>' +
        rows +
        '<button class="btn-secondary" style="width:100%" data-action="add-choice"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a choice</button>' +
        '<p class="sub" id="form-error" hidden style="color:rgb(var(--danger));margin-top:8px"></p>' +
        '<div style="display:flex;gap:8px;margin-top:16px">' +
        '<button class="btn-primary" style="flex:1" data-action="post-decision">Post decision</button></div>';
    }

    // ── render + events ───────────────────────────────────────────────────
    function render() {
      var hash = location.hash || '#/';
      var m;
      if ((m = hash.match(/^#\/d\/(\d+)$/))) {
        app.innerHTML = detailHTML();
      } else if (hash === '#/new') {
        app.innerHTML = newHTML();
        var q = document.getElementById('new-question');
        if (q) q.value = state.formQuestion || '';
        updatePostEnabled();
      } else {
        // The test hook and the wrapper for the one list view.
        app.innerHTML = '<div data-decisions>' + listHTML() + '</div>';
      }
    }

    function formError(msg) {
      var el = document.getElementById('form-error');
      if (el) { el.textContent = msg; el.hidden = !msg; }
    }
    function updatePostEnabled() {
      var btn = app.querySelector('[data-action="post-decision"]');
      if (!btn) return;
      var question = (document.getElementById('new-question').value || '').trim();
      var choices = Array.prototype.map.call(
        app.querySelectorAll('.choice-input'),
        function (el) { return el.value.trim(); }
      ).filter(Boolean);
      btn.disabled = !(question && choices.length >= 2);
    }

    function setVoteError(key, on) {
      state.voteErrors[key] = on;
      render();
    }

    function applyDecision(updated) {
      if (state.decisions) {
        state.decisions = state.decisions.map(function (d) {
          return d.id === updated.id ? updated : d;
        });
      }
      if (state.detail && state.detail.decision && state.detail.decision.id === updated.id) {
        state.detail.decision = updated;
      }
    }

    function loadList() {
      state.decisions = null;
      state.listFailed = false;
      render();
      return api('/api/decisions').then(function (data) {
        state.decisions = data.decisions;
        state.memberCount = data.member_count;
        state.viewer = data.viewer;
        state.now = Date.now();
        render();
      }).catch(function () {
        state.listFailed = true;
        render();
      });
    }

    var currentDetailId = null;
    function loadDetail(id) {
      currentDetailId = id;
      state.detail = null;
      state.detailFailed = null;
      state.decisionReported = false;
      state.commentReported = {};
      state.commentError = false;
      render();
      return api('/api/decisions/' + id).then(function (data) {
        if (currentDetailId !== id) return;
        state.detail = { decision: data.decision, comments: data.comments };
        state.memberCount = data.member_count;
        state.viewer = data.viewer;
        state.now = Date.now();
        render();
      }).catch(function (err) {
        if (currentDetailId !== id) return;
        state.detailFailed = err.status === 404 ? 'missing' : 'failed';
        render();
      });
    }

    function vote(decisionId, choiceId, detail) {
      var key = detail ? 'd' + decisionId : decisionId;
      return api('/api/decisions/' + decisionId + '/vote', { method: 'POST', body: { choice_id: choiceId } })
        .then(function (data) {
          delete state.voteErrors[key];
          applyDecision(data.decision);
          render();
        })
        .catch(function (err) {
          if (err.code === 'closed') { // someone closed it while you were here
            setVoteError(key, false);
            return refreshAfterClosed(decisionId);
          }
          setVoteError(key, true);
        });
    }
    function refreshAfterClosed(decisionId) {
      api('/api/decisions/' + decisionId).then(function (data) {
        applyDecision(data.decision);
        if (state.detail) state.detail.decision = data.decision;
        render();
      }).catch(function () { render(); });
    }

    app.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el) return;
      var action = el.getAttribute('data-action');

      if (action === 'go-new') {
        state.formChoices = ['', ''];
        state.formQuestion = '';
        location.hash = '#/new';
      } else if (action === 'back') {
        location.hash = '#/';
      } else if (action === 'retry') {
        loadList();
      } else if (action === 'retry-detail') {
        loadDetail(currentDetailId);
      } else if (action === 'vote') {
        vote(Number(el.getAttribute('data-decision')), Number(el.getAttribute('data-choice')), false);
      } else if (action === 'vote-detail') {
        vote(Number(el.getAttribute('data-decision')), Number(el.getAttribute('data-choice')), true);
      } else if (action === 'close' || action === 'close-detail') {
        var id = Number(el.getAttribute('data-decision'));
        api('/api/decisions/' + id + '/close', { method: 'POST' }).then(function (data) {
          applyDecision(data.decision);
          render();
        }).catch(function (err) {
          if (err.status === 409) refreshAfterClosed(id); // already closed
        });
      } else if (action === 'delete-decision') {
        var delId = Number(el.getAttribute('data-decision'));
        if (!window.confirm('Delete this decision, its votes and its comments?')) return;
        api('/api/decisions/' + delId, { method: 'DELETE' }).then(function () {
          if (state.decisions) {
            state.decisions = state.decisions.filter(function (d) { return d.id !== delId; });
          }
          location.hash = '#/';
        }).catch(function () {});
      } else if (action === 'delete-comment') {
        var cid = Number(el.getAttribute('data-comment'));
        api('/api/comments/' + cid, { method: 'DELETE' }).then(function () {
          if (state.detail) {
            state.detail.comments = state.detail.comments.filter(function (c) { return c.id !== cid; });
          }
          render();
        }).catch(function () {});
      } else if (action === 'report-decision') {
        var rid = Number(el.getAttribute('data-decision'));
        api('/api/reports', { method: 'POST', body: { kind: 'decision', id: rid } }).then(function () {
          state.decisionReported = true;
          render();
        }).catch(function () {});
      } else if (action === 'report-comment') {
        var rcid = Number(el.getAttribute('data-comment'));
        api('/api/reports', { method: 'POST', body: { kind: 'comment', id: rcid } }).then(function () {
          state.commentReported[rcid] = true;
          render();
        }).catch(function () {});
      } else if (action === 'add-choice') {
        var inputs = app.querySelectorAll('.choice-input');
        if (inputs.length >= 8) return;
        state.formChoices = Array.prototype.map.call(inputs, function (i2) { return i2.value; });
        state.formChoices.push('');
        state.formQuestion = document.getElementById('new-question').value;
        render();
      } else if (action === 'remove-choice') {
        var row = el.parentElement;
        var all = app.querySelectorAll('.choice-input');
        if (all.length <= 2) { // two choices are the minimum
          formError('Keep at least two choices.');
          return;
        }
        row.remove();
        updatePostEnabled();
        formError('');
      } else if (action === 'post-decision') {
        var question = (document.getElementById('new-question').value || '').trim();
        var labels = [];
        var seen = {};
        Array.prototype.forEach.call(app.querySelectorAll('.choice-input'), function (i3) {
          var v = i3.value.trim();
          if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = true; labels.push(v); }
        });
        if (!question) { formError('Write the question first.'); return; }
        if (labels.length < 2) { formError('Add at least two different choices.'); return; }
        el.disabled = true;
        api('/api/decisions', { method: 'POST', body: { question: question, choices: labels } })
          .then(function () {
            state.formChoices = null;
            state.formQuestion = '';
            location.hash = '#/';
            loadList();
          })
          .catch(function (err) {
            el.disabled = false;
            formError(err.code === 'choices_required'
              ? 'Add at least two different choices.'
              : 'The decision didn\'t save. Try again.');
          });
      } else if (action === 'post-comment') {
        var field = document.getElementById('comment-body');
        var body = (field.value || '').trim();
        if (!body) return;
        el.disabled = true;
        api('/api/decisions/' + el.getAttribute('data-decision') + '/comments',
          { method: 'POST', body: { body: body } })
          .then(function (data) {
            el.disabled = false;
            state.commentError = false;
            field.value = '';
            if (state.detail) state.detail.comments.push(data.comment);
            render();
          })
          .catch(function () {
            el.disabled = false;
            state.commentError = true; // the typed text stays in the field
            render();
          });
      }
    });

    app.addEventListener('input', function (ev) {
      if (ev.target.id === 'new-question') state.formQuestion = ev.target.value;
      if (ev.target.classList.contains('choice-input') || ev.target.id === 'new-question') {
        updatePostEnabled();
      }
    });

    function route() {
      var hash = location.hash || '#/';
      var m = hash.match(/^#\/d\/(\d+)$/);
      if (m) {
        loadDetail(Number(m[1]));
      } else if (hash === '#/new') {
        if (!state.formChoices) state.formChoices = ['', ''];
        render();
      } else {
        if (state.decisions === null || state.listFailed) loadList();
        else render();
      }
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>
