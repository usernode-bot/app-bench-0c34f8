<body class="min-h-screen bg-ground text-fg">
  <!-- The whole app is one screen: add a thing to rank, drag it into a tier
       from S to F, flip between your own tiers and the crowd's average, and
       tap any item to see who placed it where. Built from the design kit in
       styles/tailwind-input.css; CLAUDE.md's "## Design" says how. -->
  <main class="mx-auto w-full max-w-md px-4 pb-12 pt-6">
    <div class="mb-4 flex items-center justify-between gap-3">
      <h1 class="text-title">Tier list</h1>
      <button type="button" id="add-item-btn" class="btn-primary flex-none">Add item</button>
    </div>

    <div class="mb-5 flex rounded-xl border border-line bg-surface p-1" role="group" aria-label="Whose tiers to show">
      <button type="button" id="view-mine" class="seg" aria-pressed="true">My tiers</button>
      <button type="button" id="view-crowd" class="seg" aria-pressed="false">Crowd</button>
    </div>

    <section id="tier-board">
      <p id="pool-label" class="section-label">To rank</p>
      <div id="pool" class="mb-4 flex flex-wrap gap-2"></div>
      <div id="board-note" hidden></div>
      <div id="tiers"></div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var TIERS = ['S', 'A', 'B', 'C', 'D', 'F'];
      // The iframe load arrives with ?token=…; forward it on API calls. At
      // the app's own address the edge adds the header itself instead.
      var TOKEN = new URLSearchParams(location.search).get('token');

      var state = { items: [], view: 'mine', loaded: false };

      var boardEl = document.getElementById('tier-board');
      var poolEl = document.getElementById('pool');
      var tiersEl = document.getElementById('tiers');
      var noteEl = document.getElementById('board-note');
      var mineBtn = document.getElementById('view-mine');
      var crowdBtn = document.getElementById('view-crowd');
      var addBtn = document.getElementById('add-item-btn');
      var poolLabel = document.getElementById('pool-label');

      function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({}, opts.headers, TOKEN ? { 'x-usernode-token': TOKEN } : {});
        return fetch(path, opts);
      }

      function toast(message) {
        if (window.unNative && unNative.toast) unNative.toast(message);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function findItem(id) {
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].id === id) return state.items[i];
        }
        return null;
      }

      // Sheets: the native kit's bottom sheet, with a plain fallback for a
      // bare local run where the hosted kit is not reachable.
      var openSheetHandle = null;
      var openSheetId = null;
      function presentSheet(contentEl) {
        if (window.unNative && unNative.presentSheet) {
          return unNative.presentSheet({ contentEl: contentEl });
        }
        var backdrop = el('div', 'fixed inset-0 z-40 bg-fg/50');
        var panel = el('div', 'fixed inset-x-0 bottom-0 z-50 overflow-y-auto rounded-t-2xl bg-surface');
        panel.appendChild(contentEl);
        document.body.appendChild(backdrop);
        document.body.appendChild(panel);
        var handle = {
          el: panel,
          dismiss: function () {
            backdrop.remove();
            panel.remove();
            if (openSheetHandle === handle) { openSheetHandle = null; openSheetId = null; }
          },
        };
        backdrop.addEventListener('click', handle.dismiss);
        return handle;
      }
      function closeSheet() {
        if (openSheetHandle) openSheetHandle.dismiss();
        openSheetHandle = null;
        openSheetId = null;
        sheetTierButtons = [];
        reloadSheetVotes = null;
        sheetCrowdEl = null;
      }

      // ── rendering ───────────────────────────────────────────────────────
      function chipEl(item) {
        var chip = el('button', 'chip', item.name);
        chip.type = 'button';
        chip.dataset.id = item.id;
        return chip;
      }

      function byName(a, b) { return a.name.localeCompare(b.name); }

      function renderBoard() {
        var mine = state.view === 'mine';
        var key = mine ? 'mine' : 'crowd';
        boardEl.classList.toggle('can-drag', mine);
        var pile = [];
        var byTier = {};
        TIERS.forEach(function (t) { byTier[t] = []; });
        state.items.forEach(function (item) {
          if (item[key] && byTier[item[key]]) byTier[item[key]].push(item);
          else pile.push(item);
        });
        pile.sort(byName);
        TIERS.forEach(function (t) { byTier[t].sort(byName); });

        noteEl.hidden = true;
        poolLabel.hidden = false;
        poolEl.hidden = false;
        tiersEl.hidden = false;

        poolEl.textContent = '';
        if (pile.length) {
          pile.forEach(function (item) { poolEl.appendChild(chipEl(item)); });
        } else {
          poolEl.appendChild(el('p', 'flex min-h-11 items-center px-1 text-small text-muted',
            mine ? 'You have ranked everything' : 'The crowd has ranked everything'));
        }

        renderRows(byTier, mine);
      }

      function renderRows(byTier, mine) {
        tiersEl.textContent = '';
        TIERS.forEach(function (tier) {
          var row = el('div', 'tier-row');
          row.dataset.tier = tier;
          row.appendChild(el('div', 'tier-letter', tier));
          var chips = el('div', 'row-chips');
          if (byTier[tier] && byTier[tier].length) {
            byTier[tier].forEach(function (item) { chips.appendChild(chipEl(item)); });
          } else if (mine) {
            chips.appendChild(el('span', 'flex min-h-11 items-center text-small text-muted', 'Drop here'));
          }
          row.appendChild(chips);
          tiersEl.appendChild(row);
        });
      }

      function renderEmpty() {
        poolLabel.hidden = true;
        poolEl.hidden = true;
        tiersEl.hidden = false;
        noteEl.hidden = false;
        noteEl.textContent = '';
        var box = el('div', 'state-empty');
        box.appendChild(el('p', 'text-heading', 'Nothing to rank yet'));
        box.appendChild(el('p', 'text-body text-muted', 'Add a restaurant, a film, anything. Then drag it into a tier.'));
        var btn = el('button', 'btn-secondary', 'Add the first item');
        btn.type = 'button';
        btn.addEventListener('click', openAddSheet);
        box.appendChild(btn);
        noteEl.appendChild(box);
        renderRows({}, true);
      }

      function showError() {
        poolLabel.hidden = true;
        poolEl.hidden = true;
        tiersEl.hidden = true;
        noteEl.hidden = false;
        noteEl.textContent = '';
        var box = el('div', 'state-error');
        box.appendChild(el('p', 'text-heading', 'The board did not load'));
        box.appendChild(el('p', 'text-body text-muted', 'Nothing was lost: the items and every placement are safe on the server.'));
        var retry = el('button', 'btn-secondary', 'Retry');
        retry.type = 'button';
        retry.addEventListener('click', function () { load(); });
        box.appendChild(retry);
        noteEl.appendChild(box);
      }

      function showSkeleton() {
        noteEl.hidden = true;
        poolEl.hidden = false;
        tiersEl.hidden = false;
        poolEl.textContent = '';
        for (var i = 0; i < 3; i++) poolEl.appendChild(el('span', 'skeleton h-11 w-36'));
        tiersEl.textContent = '';
        TIERS.forEach(function (tier) {
          var row = el('div', 'tier-row');
          row.appendChild(el('div', 'tier-letter', tier));
          var chips = el('div', 'row-chips');
          chips.appendChild(el('span', 'skeleton h-11 w-40'));
          row.appendChild(chips);
          tiersEl.appendChild(row);
        });
      }

      function load() {
        showSkeleton();
        return api('/api/items').then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function (items) {
          state.items = items;
          state.loaded = true;
          if (items.length) renderBoard();
          else renderEmpty();
        }).catch(function () {
          state.loaded = false;
          showError();
        });
      }

      // ── placing ─────────────────────────────────────────────────────────
      var sheetTierButtons = [];
      var reloadSheetVotes = null;
      var drag = null;

      function syncSheetButtons(item) {
        if (openSheetId !== item.id) return;
        sheetTierButtons.forEach(function (btn) {
          var on = btn.dataset.tier === item.mine;
          btn.className = on ? 'btn-primary px-0' : 'btn-secondary px-0';
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }

      // Optimistic: move the chip now, save in the background, undo on
      // failure so the board never lies about what the server holds.
      function placeItem(item, tier) {
        var previous = item.mine;
        item.mine = tier;
        renderBoard();
        api('/api/items/' + item.id + '/placement', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ tier: tier }),
        }).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          refreshCrowd();
          if (reloadSheetVotes) reloadSheetVotes();
        }).catch(function () {
          item.mine = previous;
          renderBoard();
          syncSheetButtons(item);
          toast('Could not save that placement. Nothing changed.');
        });
      }

      // Quiet re-sync after a placement so the crowd averages and vote
      // counts stay honest; never re-render under a drag in progress.
      function refreshCrowd() {
        api('/api/items').then(function (res) {
          return res.ok ? res.json() : null;
        }).then(function (items) {
          if (!items) return;
          state.items = items;
          if (!drag) {
            if (state.loaded && state.items.length) renderBoard();
            var open = findItem(openSheetId);
            if (open) renderSheetCrowd(open);
          }
        }).catch(function () {});
      }

      // ── drag & tap ──────────────────────────────────────────────────────
      boardEl.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        // The crowd view is read-only: taps there go through click.
        if (state.view !== 'mine') return;
        var chip = e.target.closest('.chip');
        if (!chip || !chip.dataset.id) return;
        var rect = chip.getBoundingClientRect();
        drag = {
          pointerId: e.pointerId,
          id: Number(chip.dataset.id),
          chipEl: chip,
          startX: e.clientX,
          startY: e.clientY,
          offX: e.clientX - rect.left,
          offY: e.clientY - rect.top,
          moved: false,
          ghost: null,
          hint: null,
        };
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerCancel);
      });

      function hint(zone) {
        if (!drag || drag.hint === zone) return;
        if (drag.hint) drag.hint.classList.remove('drop-hint');
        drag.hint = zone;
        if (drag.hint) drag.hint.classList.add('drop-hint');
      }

      function onPointerMove(e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (!drag.moved) {
          if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 8) return;
          drag.moved = true;
          var ghost = drag.chipEl.cloneNode(true);
          ghost.className = 'chip chip-ghost';
          ghost.style.width = drag.chipEl.getBoundingClientRect().width + 'px';
          document.body.appendChild(ghost);
          drag.ghost = ghost;
          drag.chipEl.style.opacity = '0.4';
        }
        e.preventDefault();
        drag.ghost.style.transform =
          'translate(' + (e.clientX - drag.offX) + 'px,' + (e.clientY - drag.offY) + 'px)';
        var target = document.elementFromPoint(e.clientX, e.clientY);
        var zone = target && (target.closest('.tier-row') || target.closest('#pool'));
        hint(zone || null);
        // Nudge the page at the edges so the bottom rows are reachable.
        if (e.clientY < 90) window.scrollBy(0, -10);
        else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 10);
      }

      function endDrag() {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        document.removeEventListener('pointercancel', onPointerCancel);
        if (drag) {
          if (drag.ghost) drag.ghost.remove();
          if (drag.hint) drag.hint.classList.remove('drop-hint');
          if (drag.chipEl) drag.chipEl.style.opacity = '';
        }
      }

      function onPointerUp(e) {
        var d = drag;
        endDrag();
        drag = null;
        if (!d || e.pointerId !== d.pointerId) return;
        if (!d.moved) {
          openItemSheet(d.id); // a tap: open how everyone placed it
          return;
        }
        var target = document.elementFromPoint(e.clientX, e.clientY);
        var zone = target && (target.closest('.tier-row') || target.closest('#pool'));
        var tier = zone && zone.dataset && zone.dataset.tier ? zone.dataset.tier : null;
        var item = findItem(d.id);
        if (tier && item && item.mine !== tier) {
          placeItem(item, tier);
        } else {
          renderBoard(); // dropped outside a tier, or back on the pile
        }
      }

      function onPointerCancel() {
        var d = drag;
        endDrag();
        drag = null;
        if (d && d.moved) renderBoard();
      }

      // Keyboard (and crowd-view) taps arrive as clicks.
      boardEl.addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip || !chip.dataset.id) return;
        if (state.view !== 'mine' || e.detail === 0) openItemSheet(Number(chip.dataset.id));
      });

      // ── the item sheet ──────────────────────────────────────────────────
      var sheetCrowdEl = null;

      function renderSheetCrowd(item) {
        if (!sheetCrowdEl) return;
        sheetCrowdEl.textContent = '';
        if (item.crowd) {
          sheetCrowdEl.appendChild(el('div', 'tier-letter', item.crowd));
          var col = el('div');
          col.appendChild(el('p', 'text-body font-medium', 'Crowd'));
          col.appendChild(el('p', 'text-small text-muted',
            item.votes + (item.votes === 1 ? ' vote' : ' votes')));
          sheetCrowdEl.appendChild(col);
        } else {
          var none = el('div');
          none.appendChild(el('p', 'text-body', 'No votes yet'));
          none.appendChild(el('p', 'text-small text-muted', 'Be the first to place it.'));
          sheetCrowdEl.appendChild(none);
        }
      }

      function openItemSheet(id) {
        var item = findItem(id);
        if (!item) return;
        closeSheet();

        var box = el('div', 'flex flex-col gap-4 px-5 pb-8 pt-3');
        box.appendChild(el('h2', 'text-heading', item.name));

        sheetCrowdEl = el('div', 'flex items-center gap-3');
        renderSheetCrowd(item);
        box.appendChild(sheetCrowdEl);

        var placeWrap = el('div', 'flex flex-col gap-2');
        placeWrap.appendChild(el('p', 'section-label', 'Your placement'));
        var grid = el('div', 'grid grid-cols-6 gap-1.5');
        TIERS.forEach(function (t) {
          var btn = el('button', item.mine === t ? 'btn-primary px-0' : 'btn-secondary px-0', t);
          btn.type = 'button';
          btn.dataset.tier = t;
          btn.setAttribute('aria-pressed', item.mine === t ? 'true' : 'false');
          btn.addEventListener('click', function () {
            if (item.mine !== t) {
              placeItem(item, t);
              syncSheetButtons(item);
            }
          });
          sheetTierButtons.push(btn);
          grid.appendChild(btn);
        });
        placeWrap.appendChild(grid);
        box.appendChild(placeWrap);

        var votesWrap = el('div', 'flex flex-col gap-2');
        votesWrap.appendChild(el('p', 'section-label', 'How friends placed it'));
        var votesBox = el('div', 'flex flex-col gap-2');
        votesBox.appendChild(el('span', 'skeleton h-11'));
        votesBox.appendChild(el('span', 'skeleton h-11'));
        votesWrap.appendChild(votesBox);
        box.appendChild(votesWrap);

        openSheetHandle = presentSheet(box);
        openSheetId = id;

        function loadVotes() {
          api('/api/items/' + id + '/placements').then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          }).then(function (data) {
            if (openSheetId !== id) return;
            votesBox.textContent = '';
            if (!data.placements.length) {
              votesBox.appendChild(el('p', 'text-small text-muted', 'Nobody has placed it yet.'));
            } else {
              var list = el('ul', 'list');
              data.placements.forEach(function (p) {
                var li = el('li', 'list-row justify-between');
                li.appendChild(el('span', 'text-body', p.username || 'Someone'));
                li.appendChild(el('span',
                  'flex h-7 w-7 flex-none items-center justify-center rounded-md bg-accent text-small font-bold text-on-accent',
                  p.tier));
                list.appendChild(li);
              });
              votesBox.appendChild(list);
            }
          }).catch(function () {
            if (openSheetId !== id) return;
            votesBox.textContent = '';
            votesBox.appendChild(el('p', 'text-small text-muted',
              'Could not load the votes. Your own placement above still works.'));
          });
        }
        loadVotes();
        reloadSheetVotes = loadVotes;
      }

      // ── the add-item sheet ──────────────────────────────────────────────
      function openAddSheet() {
        closeSheet();
        var box = el('div', 'flex flex-col gap-4 px-5 pb-8 pt-3');
        box.appendChild(el('h2', 'text-heading', 'Add item'));
        var form = el('form', 'flex flex-col gap-3');
        var label = el('label', 'text-small font-medium', 'Item name');
        label.htmlFor = 'item-name';
        var input = el('input', 'field');
        input.id = 'item-name';
        input.name = 'name';
        input.type = 'text';
        input.maxLength = 80;
        input.placeholder = 'e.g. Tangletown Cafe';
        input.autocomplete = 'off';
        var error = el('p', 'text-small text-danger');
        error.hidden = true;
        var submit = el('button', 'btn-primary', 'Add item');
        submit.type = 'submit';
        form.appendChild(label);
        form.appendChild(input);
        form.appendChild(error);
        form.appendChild(submit);
        box.appendChild(form);
        openSheetHandle = presentSheet(box);
        openSheetId = null;
        input.focus();

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var name = input.value.trim();
          if (!name) {
            error.textContent = 'Give the item a name.';
            error.hidden = false;
            return;
          }
          if (name.length > 80) {
            error.textContent = 'Keep the name under 80 characters.';
            error.hidden = false;
            return;
          }
          error.hidden = true;
          submit.disabled = true;
          api('/api/items', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ name: name }),
          }).then(function (res) {
            if (res.status === 401) throw { handled: true }; // the bridge asks for an account
            if (!res.ok) {
              return res.json().then(function (body) {
                throw new Error(body.error || 'Could not add the item.');
              });
            }
            return res.json();
          }).then(function (item) {
            state.items.push(item);
            state.loaded = true;
            closeSheet();
            renderBoard();
            toast('Added to To rank');
          }).catch(function (err) {
            submit.disabled = false;
            if (err && err.handled) return;
            error.textContent = (err && err.message) || 'Could not add the item.';
            error.hidden = false;
          });
        });
      }

      // ── wiring ──────────────────────────────────────────────────────────
      function setView(view) {
        if (state.view === view) return;
        state.view = view;
        mineBtn.setAttribute('aria-pressed', view === 'mine' ? 'true' : 'false');
        crowdBtn.setAttribute('aria-pressed', view === 'crowd' ? 'true' : 'false');
        if (state.loaded && state.items.length) renderBoard();
      }
      mineBtn.addEventListener('click', function () { setView('mine'); });
      crowdBtn.addEventListener('click', function () { setView('crowd'); });
      addBtn.addEventListener('click', openAddSheet);

      load();
    })();
  </script>
</body>
</html>
