<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23c2410c'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so omitting it would make the app invisible
       to anything that asks the frame a question. It is also where the page
       learns the viewer's light/dark theme and, for visitors without an
       account, turns a 401 `account_required` write into the
       make-an-account prompt. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: press-orange
       accent on warm stone neutrals, both looks, with the feed stamp and the
       ink dot as the reader's signature elements. CLAUDE.md's "## Design"
       records the choices; every later change follows it. -->
  <main class="mx-auto flex max-w-md flex-col gap-6 px-4 py-10">

    <header class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h1 class="text-title">Unread</h1>
        <p id="count-line" class="text-small text-muted" hidden></p>
      </div>
      <button id="refresh-btn" type="button" class="btn-secondary flex-none">Refresh</button>
    </header>

    <!-- The primary action: paste a feed link and follow it. -->
    <section>
      <form id="add-form" novalidate>
        <p id="add-error" class="mb-2 px-1 text-small text-danger" hidden></p>
        <label class="section-label" for="feed-url">Add a feed</label>
        <div class="flex gap-2">
          <input id="feed-url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 class="field grow" placeholder="e.g. https://blog.example.com/feed.xml">
          <button id="add-btn" type="submit" class="btn-primary flex-none">Add</button>
        </div>
      </form>
    </section>

    <div id="content" class="flex flex-col gap-4"></div>

    <button id="markall-btn" type="button" class="btn-secondary self-center" hidden>Mark all read</button>
  </main>

  <script>
  (function () {
    'use strict';

    function $(id) { return document.getElementById(id); }
    var els = {
      countLine: $('count-line'),
      refreshBtn: $('refresh-btn'),
      addError: $('add-error'),
      feedInput: $('feed-url'),
      addBtn: $('add-btn'),
      addForm: $('add-form'),
      content: $('content'),
      markAllBtn: $('markall-btn'),
    };

    var state = {
      loading: true,       // a load is in flight
      firstLoadDone: false,
      demo: false,         // staging demo mode (?demo=1): read state stays in memory
      demoRead: null,      // Set of read post ids in demo mode
      posts: [],
      feedCount: 0,
      failed: [],
      openId: null,        // the one post whose preview is open
    };
    var rowEls = {};       // post id -> { btn, dot, title, preview } of the current list

    // The platform's shell opens this page with ?token=… (a platform-issued
    // RS256 JWT). Forward it on every API call as x-usernode-token; inside
    // the platform the edge also adds the header to same-origin requests,
    // and a repeated header is harmless.
    var TOKEN = new URLSearchParams(location.search).get('token') || '';

    // Staging demo mode (?demo=1): the server answers with obviously fake
    // posts and the page keeps read state in memory only. Production
    // ignores the parameter on the server, and the server's answer decides
    // whether the page is in demo mode.
    var DEMO_QUERY = new URLSearchParams(location.search).get('demo') === '1' ? '?demo=1' : '';

    // "Now" through the platform, so a staging preview shown as of a chosen
    // moment holds still. Forwarded to the server as x-usernode-now.
    function nowIso() {
      try {
        if (window.usernode && typeof window.usernode.now === 'function') return window.usernode.now();
      } catch (e) {}
      return new Date().toISOString();
    }

    function api(path, opts) {
      opts = opts || {};
      var headers = { 'x-usernode-now': nowIso() };
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      opts.headers = Object.assign(headers, opts.headers || {});
      return fetch(path, opts).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) {
            var err = new Error(data.message || ('Request failed (' + res.status + ')'));
            err.status = res.status;
            err.code = data.error || '';
            throw err;
          }
          return data;
        });
      });
    }

    function formatWhen(iso) {
      if (!iso) return '';
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var diff = Math.max(0, new Date(nowIso()).getTime() - t);
      if (diff < 3600e3) return Math.max(1, Math.round(diff / 60e3)) + 'm ago';
      if (diff < 86400e3) { var h = Math.round(diff / 3600e3); return h + 'h ago'; }
      if (diff < 2 * 86400e3) return 'yesterday';
      return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function isRead(p) {
      if (state.demo) return state.demoRead.has(p.id);
      return !!p.read_at;
    }

    function initialOf(p) {
      return p.feed_initial || (p.feed_title || '').trim().charAt(0).toUpperCase() || '?';
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined && text !== null && text !== '') n.textContent = text;
      return n;
    }

    // ── Rendering ─────────────────────────────────────────────────────────

    function unreadCount() {
      var n = 0;
      for (var i = 0; i < state.posts.length; i++) if (!isRead(state.posts[i])) n++;
      return n;
    }

    // The count line: "3 unread from 2 feeds", or "All read". Hidden while
    // there are no feeds (the empty state carries that message).
    function renderCount() {
      if (!state.firstLoadDone || state.feedCount === 0) { els.countLine.hidden = true; }
      else {
        var unread = unreadCount();
        els.countLine.hidden = false;
        els.countLine.textContent = unread === 0
          ? 'All read'
          : unread + ' unread from ' + state.feedCount + (state.feedCount === 1 ? ' feed' : ' feeds');
      }
      els.markAllBtn.hidden = !(state.firstLoadDone && state.posts.length > 0 && unreadCount() > 0);
    }

    function render() {
      renderCount();
      if (state.loading && !state.firstLoadDone) { renderContent([buildSkeleton()]); return; }
      if (!state.firstLoadDone) return;

      var hasFeeds = state.feedCount > 0;
      if (!hasFeeds) return renderContent([buildEmpty()]);

      var parts = [];
      if (state.failed.length > 0 && state.posts.length === 0) {
        // Refresh failed and nothing is stored: the honest error state.
        parts.push(buildError());
      } else {
        if (state.failed.length > 0) parts.push(buildPartialNotice());
        if (state.posts.length === 0) parts.push(buildNoPosts());
        parts.push(buildList());
      }
      renderContent(parts);
    }

    // A failed load (the API call itself, not a feed): what failed, what
    // still works, and a way back.
    function renderError() {
      els.countLine.hidden = true;
      els.markAllBtn.hidden = true;
      renderContent([buildError()]);
    }

    function renderContent(children) {
      els.content.textContent = '';
      for (var i = 0; i < children.length; i++) els.content.appendChild(children[i]);
    }

    function buildSkeleton() {
      var ul = el('ul', 'list');
      ul.setAttribute('aria-hidden', 'true');
      for (var i = 0; i < 5; i++) {
        var li = el('li', 'list-row items-start');
        li.appendChild(el('span', 'skeleton h-9 w-9 flex-none rounded-lg'));
        var main = el('span', 'min-w-0 flex-1');
        main.appendChild(el('span', 'skeleton block h-4 w-3/4'));
        main.appendChild(el('span', 'skeleton mt-2 block h-3 w-1/3'));
        li.appendChild(main);
        ul.appendChild(li);
      }
      return ul;
    }

    function buildEmpty() {
      var d = el('div', 'state-empty');
      d.appendChild(el('p', 'text-heading', 'No feeds yet'));
      d.appendChild(el('p', 'text-body text-muted', 'Paste a feed link above to start following it.'));
      return d;
    }

    function buildNoPosts() {
      var d = el('div', 'state-empty');
      d.appendChild(el('p', 'text-heading', 'No posts yet'));
      d.appendChild(el('p', 'text-body text-muted', 'Your feeds have not published anything yet. Try Refresh later.'));
      return d;
    }

    function buildError() {
      var d = el('div', 'state-error');
      d.appendChild(el('p', 'text-heading', 'Could not reach your feeds'));
      d.appendChild(el('p', 'text-body text-muted', 'Reading your saved posts still works. Check your connection and try again.'));
      var b = el('button', 'btn-secondary', 'Retry');
      b.type = 'button';
      b.addEventListener('click', load);
      d.appendChild(b);
      return d;
    }

    function buildPartialNotice() {
      var d = el('div', 'flex items-center justify-between gap-3 rounded-lg border border-line bg-raised px-3 py-2');
      d.appendChild(el('p', 'text-small text-muted', 'Could not reach: ' + state.failed.join(', ')));
      var b = el('button', 'btn-secondary flex-none', 'Retry');
      b.type = 'button';
      b.addEventListener('click', load);
      d.appendChild(b);
      return d;
    }

    function metaLine(p) {
      var parts = [];
      if (p.feed_title) parts.push(p.feed_title);
      var when = formatWhen(p.published_at);
      if (when) parts.push(when);
      return parts.join(', ');
    }

    function buildPreviewInto(preview, p) {
      var when = p.published_at ? formatDate(p.published_at) : '';
      var dateLine = [p.feed_title, when].filter(Boolean).join(', ');
      preview.appendChild(el('p', 'text-small text-muted', dateLine || metaLine(p) || 'Unknown date'));
      preview.appendChild(el('p', 'font-serif text-body', p.excerpt || 'No excerpt in this feed entry.'));
      if (p.link) {
        var a = el('a', 'text-small font-medium text-accent underline underline-offset-2', 'Open in browser');
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        preview.appendChild(a);
      }
    }

    function buildList() {
      rowEls = {};
      var ul = el('ul', 'list');
      state.posts.forEach(function (p) {
        var li = el('li');
        var btn = el('button', 'list-row w-full items-start text-left');
        btn.type = 'button';
        btn.setAttribute('aria-expanded', String(state.openId === p.id));

        btn.appendChild(el('span', 'feed-stamp', initialOf(p)));
        var main = el('span', 'min-w-0 flex-1');
        var title = el('span', 'block font-serif text-body' + (isRead(p) ? ' text-muted' : ''), p.title || 'Untitled post');
        var meta = el('span', 'mt-0.5 block truncate text-small text-muted', metaLine(p));
        main.appendChild(title);
        main.appendChild(meta);
        btn.appendChild(main);
        var dot = el('span', 'unread-dot mt-2');
        if (isRead(p)) dot.hidden = true;
        btn.appendChild(dot);

        var preview = el('div', 'preview');
        preview.id = 'preview-' + p.id;
        buildPreviewInto(preview, p);
        if (state.openId !== p.id) preview.hidden = true;
        btn.setAttribute('aria-controls', preview.id);

        btn.addEventListener('click', function () { onRowTap(p); });
        li.appendChild(btn);
        li.appendChild(preview);
        ul.appendChild(li);
        rowEls[p.id] = { btn: btn, dot: dot, title: title, preview: preview };
      });
      return ul;
    }

    // ── Interactions ──────────────────────────────────────────────────────

    function onRowTap(p) {
      var refs = rowEls[p.id];
      if (!refs) return;
      if (state.openId === p.id) {           // tapping again closes the preview
        state.openId = null;
        refs.preview.hidden = true;
        refs.btn.setAttribute('aria-expanded', 'false');
        return;
      }
      if (state.openId !== null && rowEls[state.openId]) {
        rowEls[state.openId].preview.hidden = true;
        rowEls[state.openId].btn.setAttribute('aria-expanded', 'false');
      }
      state.openId = p.id;
      refs.preview.hidden = false;
      refs.btn.setAttribute('aria-expanded', 'true');
      if (!isRead(p)) markRead(p);
    }

    // Read the moment it is tapped: the dot disappears, the row dims, and
    // the count drops — before the server confirms. Reverted if it fails.
    function markRead(p) {
      var refs = rowEls[p.id];
      if (state.demo) {
        state.demoRead.add(p.id);
        applyRead(p, refs);
        return;
      }
      var prev = p.read_at;
      p.read_at = nowIso();
      applyRead(p, refs);
      api('/api/posts/' + encodeURIComponent(p.id) + '/read', { method: 'POST' })
        .catch(function () {
          p.read_at = prev;
          if (refs && refs.dot.isConnected) applyRead(p, refs);
          else render();
        });
    }

    function applyRead(p, refs) {
      if (refs) {
        refs.dot.hidden = true;
        refs.title.classList.add('text-muted');
      }
      renderCount();
    }

    function markAllRead() {
      if (state.demo) {
        state.posts.forEach(function (p) { state.demoRead.add(p.id); });
        render();
        return;
      }
      var changed = state.posts.filter(function (p) { return !p.read_at; });
      if (!changed.length) return;
      var stamp = nowIso();
      changed.forEach(function (p) {
        p.read_at = stamp;
        applyRead(p, rowEls[p.id]);
      });
      api('/api/posts/read-all', { method: 'POST' }).catch(load);
    }

    var BAD_LINK = 'That link did not work as an RSS feed. Check the address and try again.';

    function addFeed() {
      var url = els.feedInput.value.trim();
      els.addError.hidden = true;
      if (!url) { els.feedInput.focus(); return; }
      els.addBtn.disabled = true;
      api('/api/feeds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url }),
      })
        .then(function () {
          els.feedInput.value = '';
          state.openId = null;
          return load();
        })
        .catch(function (err) {
          if (err.code === 'account_required') return; // the bridge asks for an account
          els.addError.textContent = err.code === 'duplicate' ? 'You already follow this feed.' : BAD_LINK;
          els.addError.hidden = false;
        })
        .finally(function () {
          els.addBtn.disabled = false;
          els.feedInput.focus();
        });
    }

    // ── Loading ───────────────────────────────────────────────────────────

    function load() {
      state.loading = true;
      els.refreshBtn.disabled = true;
      els.refreshBtn.setAttribute('aria-busy', 'true');
      if (!state.firstLoadDone) render();
      return api('/api/posts' + DEMO_QUERY)
        .then(function (data) {
          state.demo = !!data.demo;
          state.demoRead = state.demo
            ? new Set((data.posts || []).filter(function (p) { return p.read_at; }).map(function (p) { return p.id; }))
            : null;
          state.posts = data.posts || [];
          state.feedCount = data.feedCount || 0;
          state.failed = data.failed || [];
          state.firstLoadDone = true;
          state.loading = false;
          if (state.openId !== null && !state.posts.some(function (p) { return p.id === state.openId; })) {
            state.openId = null;
          }
          render();
        })
        .catch(function () {
          state.loading = false;
          state.firstLoadDone = true;
          renderError();
        })
        .finally(function () {
          els.refreshBtn.disabled = false;
          els.refreshBtn.removeAttribute('aria-busy');
        });
    }

    els.refreshBtn.addEventListener('click', load);
    els.markAllBtn.addEventListener('click', markAllRead);
    els.addForm.addEventListener('submit', function (e) { e.preventDefault(); addFeed(); });
    load();
  })();
  </script>
</body>
</html>
