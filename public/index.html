<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || val.name + ': ' + val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23c2410c'/><g fill='none' stroke='white' stroke-width='9' stroke-linecap='round'><path d='M28 72a20 20 0 0 1 20 20'/><path d='M28 44a48 48 0 0 1 48 48'/></g><circle cx='30' cy='90' r='7' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config moved to
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup every deploy. Writing class
       names as whole literals is what keeps this working — a class
       assembled from fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform's native-feel UI kit (pull-to-refresh, sheets, menus,
       toasts), centrally hosted and loaded by RELATIVE path. Never vendor
       it and never write a hostname in front of it. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-md flex-col gap-4 px-4 pb-8 pt-4">
    <!-- Header: the heading and the one status line, refresh on the right. -->
    <header class="flex items-start justify-between gap-3">
      <div>
        <h1 class="text-title">Unread</h1>
        <p id="summary" class="sub">&nbsp;</p>
      </div>
      <button id="refresh-btn" type="button" class="icon-btn" aria-label="Check for new posts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </header>

    <!-- The one primary action: add a feed by pasting an address. -->
    <form id="add-form" novalidate>
      <label class="section-label" for="feed-url">Feed or website address</label>
      <div class="add-row">
        <input id="feed-url" name="url" type="text" class="field" inputmode="url" autocomplete="off" spellcheck="false" placeholder="e.g. example.com/blog">
        <button id="add-btn" type="submit" class="btn-primary">Add feed</button>
      </div>
      <p id="add-error" class="add-error" role="alert" hidden></p>
    </form>

    <!-- One chip per feed; the dots are the legend for the list below. -->
    <div id="chips" class="chips" hidden></div>

    <!-- The list: every unread post from all feeds, newest first. -->
    <ul id="posts" class="list" hidden></ul>

    <!-- Under the list: the catching-up block (shown only with rows). -->
    <div id="end" class="end" hidden>
      <p>That is everything new from your feeds.</p>
      <button id="mark-all-btn" type="button" class="btn-secondary">Mark all as read</button>
    </div>

    <!-- States: exactly one of these shows at a time. -->
    <div id="loading" class="list" aria-hidden="true">
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-3/4"></span><span class="skeleton h-3 w-1/3"></span></span></div>
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-2/3"></span><span class="skeleton h-3 w-1/4"></span></span></div>
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-4/5"></span><span class="skeleton h-3 w-1/3"></span></span></div>
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-3/5"></span><span class="skeleton h-3 w-1/5"></span></span></div>
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-2/3"></span><span class="skeleton h-3 w-1/4"></span></span></div>
      <div class="skeleton-row"><span class="skeleton h-2.5 w-2.5 flex-none rounded-full"></span><span class="flex min-w-0 flex-1 flex-col gap-2"><span class="skeleton h-4 w-3/4"></span><span class="skeleton h-3 w-1/3"></span></span></div>
    </div>
    <div id="state-empty" class="state-empty" hidden></div>
    <div id="state-error" class="state-error" hidden>
      <p class="text-body font-medium">Couldn't load your posts</p>
      <p class="text-small text-muted">Your feeds are saved. Check your connection and try again.</p>
      <button id="retry-btn" type="button" class="btn-secondary mt-2">Retry</button>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
