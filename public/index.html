  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

<body class="min-h-screen bg-ground text-fg">
  <div data-spec-screen="1">
    <div><div class="s"><div class="wrap">

    <li><button type="button" class="list-row kit-row" data-bread="sourdough"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 16c0-5 4-9 9-9s9 4 9 9H3z"/><path d="M9 10c1 1.5 2 2.5 4 3"/></svg><span class="tx"><span class="t">Sourdough</span><span class="sub">Starter, overnight proof</span></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></li>
    <li><button type="button" class="list-row kit-row" data-bread="bagels"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg><span class="tx"><span class="t">Bagels</span><span class="sub">Yeast, boiled then baked</span></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></li>
    <li><button type="button" class="list-row kit-row" data-bread="sourdough-bagels"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M8 7.5v.1M16.5 9v.1M15 17v.1"/></svg><span class="tx"><span class="t">Sourdough bagels</span><span class="sub">Starter, boiled then baked</span></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></li>
    <li><button type="button" class="list-row kit-row" data-bread="rye"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="8" width="18" height="9" rx="4.5"/><path d="M8 11v.1M12 13v.1M16 11v.1"/></svg><span class="tx"><span class="t">Rye</span><span class="sub">Rye and bread flour, yeast</span></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></li>
    <li><button type="button" class="list-row kit-row" data-bread="sandwich"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v8H5z"/><path d="M5 11c0-3 3-5 7-5s7 2 7 5"/></svg><span class="tx"><span class="t">Sandwich loaf</span><span class="sub">Soft crumb, baked in a tin</span></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button></li>
    </ul></section>

    <section><h2 class="section-label">Dough</h2><div class="list">
    <div class="meter"><svg viewBox="0 0 120 72" fill="none" stroke-linecap="round" aria-hidden="true"><defs><clipPath id="meter-loaf"><path d="M6 60c0-28 24-48 54-48s54 20 54 48z"/></clipPath></defs><path d="M6 60c0-28 24-48 54-48s54 20 54 48z" fill="rgb(var(--raised))"/><rect id="meter-fill" x="6" y="30" width="108" height="32" clip-path="url(#meter-loaf)" fill="rgb(var(--wheat))"/><path d="M6 60c0-28 24-48 54-48s54 20 54 48z" stroke="rgb(var(--accent))" stroke-width="2.5"/><path d="M38 24c8 6 14 10 26 13M60 18c7 5 12 8 22 10" stroke="rgb(var(--accent))" stroke-width="2"/></svg>
    <div><p class="sub">Hydration</p><p class="big" id="meter-pct">75%</p><p class="sub" id="meter-crumb">Open and airy</p></div></div>
    <div class="range"><div class="track"><div class="fill" id="range-fill"></div><div class="knob" id="range-knob"></div></div><input id="hydration" type="range" min="50" max="90" step="1" value="75" aria-label="Hydration percent"><div class="ends text-small muted"><span>50% stiff</span><span>90% very wet</span></div></div>

    <div class="seg" id="seg" style="margin-bottom:16px"><button type="button" data-size="500"><span>Small</span><span class="muted seg-g">500 g</span></button><button type="button" data-size="750"><span>Medium</span><span class="muted seg-g">750 g</span></button><button type="button" data-size="1000"><span>Large</span><span class="muted seg-g">1,000 g</span></button></div>
    </div></section>

    <section id="recipe-section"><div class="rh"><div><h2 class="text-heading">Recipe</h2><p class="sub" id="recipe-sub"></p></div><button type="button" class="btn-primary" id="copy" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>Copy recipe</button></div>

    <li aria-hidden="true" class="list-row"><span class="tx"><span class="skeleton h-4 w-1/3"></span></span><span class="skeleton h-4 w-12"></span></li>
    </ul>
    <template id="tpl-recipe-row"><li class="list-row"><span class="tx"><span class="t"></span><span class="sub" hidden></span></span><span class="g"></span></li></template>

    </section>

    <li aria-hidden="true" class="list-row"><span class="skeleton h-6 w-6"></span><span class="tx"><span class="skeleton h-4 w-2/5"></span><span class="skeleton h-3 w-1/2"></span></span><span class="skeleton h-4 w-14"></span></li>
    <li aria-hidden="true" class="list-row"><span class="skeleton h-6 w-6"></span><span class="tx"><span class="skeleton h-4 w-1/2"></span></span><span class="skeleton h-4 w-12"></span></li>
    </ul>
    <template id="tpl-timing-row"><li class="list-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"></svg><span class="tx"><span class="t"></span><span class="sub" hidden></span></span><span class="g"></span></li></template>
    <p class="sub" id="cooling" style="padding:8px 4px 0"></p></section>
    </div></div></div>
