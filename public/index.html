<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Ear Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='38' cy='70' r='17' fill='%230f766e'/><rect x='50' y='16' width='6' height='54' rx='3' fill='%230f766e'/><path d='M50 16c10 2 18 8 18 18 0-6-8-9-18-9z' fill='%230f766e'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- The practice screen, from the spec's drawing. Every value drawn there
       is sample data: app.js sets the lesson, the bar, the answers and the
       progress rows from the catalogue and the person's scores. -->
  <div data-spec-screen="1">
    <div class="app">
    <div class="top"><span class="brand">Ear Trainer</span><button id="lessons-btn" class="pick" type="button" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Lessons</button></div>
    <h1 class="title" id="lesson-title"></h1>
    <p class="sub" id="lesson-sub"></p>
    <div class="bar" id="progress-bar" aria-hidden="true"></div>
    <div class="meta"><span id="meta-question"></span><span id="meta-correct"></span></div>

    <div class="card">
    <div class="play" id="play-row"><button id="play-btn" class="btn-primary" type="button" data-play><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>Play</button><div><div class="q" id="question-text"></div><div class="hint" id="question-hint"></div></div></div>
    <div class="kb" id="keyboard"></div>
    <p class="cap">Lit keys show the notes you just heard.</p>

    <div id="result" hidden>
    <p class="q" id="result-score" style="margin-top:16px"></p>
    <p class="hint" id="result-best" style="margin:4px 0 0"></p>
    <div class="row"><button id="retry-btn" class="btn-secondary" type="button">Try again</button><button id="next-lesson-btn" class="btn-secondary" type="button">Next lesson</button></div>
    <div class="row" id="save-fail" hidden><span class="hint">Your score was not saved.</span><button id="save-retry-btn" class="btn-secondary" type="button">Retry</button></div>
    </div>
    </div>

    <div id="answers-section">
    <div class="section-label">Tap the answer you heard</div>
    <div class="ans" id="answers"></div>
    <div class="fb" id="feedback" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span id="feedback-text"></span></div>
    <div class="row"><span class="hint" id="streak"></span><button id="next-btn" class="btn-secondary" type="button" disabled>Next sound</button></div>
    </div>

    <div class="section-label">Your progress <span id="progress-demo-note" hidden><span data-usernode-demo-note>(Staging demo)</span></span></div>
    <ul class="list" id="progress-loading" hidden>
    <li class="list-row"><span class="skeleton block h-4 w-52"></span><span class="skeleton block h-4 w-12"></span></li>
    <li class="list-row"><span class="skeleton block h-4 w-44"></span><span class="skeleton block h-4 w-14"></span></li>
    <li class="list-row"><span class="skeleton block h-4 w-48"></span><span class="skeleton block h-4 w-10"></span></li>
    </ul>
    <ul class="list" id="progress-list" hidden></ul>
    <div class="state-empty" id="progress-empty" hidden><p class="text-body" style="margin:0">No scores yet. Finish a lesson to see it here.</p></div>
    <div class="state-error" id="progress-error" hidden><p class="text-body" style="margin:0">We could not load your scores. Practice still works.</p><button id="progress-retry-btn" class="btn-secondary" type="button">Retry</button></div>
    </div>
  </div>

  <!-- The Lessons list, a bottom sheet with three sections. -->
  <div id="lessons-sheet" class="fixed inset-0 z-50" hidden>
    <div id="sheet-backdrop" class="absolute inset-0 bg-fg/40"></div>
    <div role="dialog" aria-label="Lessons" class="absolute inset-x-0 bottom-0 mx-auto max-w-2xl overflow-y-auto rounded-t-2xl border-t border-x border-line bg-surface p-4" style="max-height:80vh">
    <div class="top"><span class="q">Lessons</span><button id="sheet-close-btn" class="btn-secondary" type="button">Close</button></div>
    <p class="hint" style="margin:4px 0 0">Tap a lesson to start it.</p>
    <div id="sheet-body"></div>
    </div>
  </div>

  <script src="/lessons.js"></script>
  <script src="/app.js"></script>
</body>
</html>
