<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Club Votes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='38' width='60' height='46' rx='8' fill='%23b23a1e'/><rect x='38' y='20' width='24' height='10' rx='3' fill='%23b23a1e'/><rect x='44' y='24' width='12' height='26' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- The screens the spec drew, wired to the app's data. Screen 1 (the
       decision list) is rendered below from /api/decisions; screen 2 (the
       decision opened with its comments) renders on the #/d/:id hash route.
       The drawn rows are the shape the demo and real data render into. -->
  <div data-spec-screen="1" data-decisions>
    <div class="app" id="app"></div>
  </div>
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1';
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var app = document.getElementById('app');
    var state = {
      viewer: null,        // { id, username } | null (guest)
      members: null,       // member count, or null when the platform didn't answer
      list: null,          // GET /decisions payload once loaded
      listFailed: false,
      detail: null,        // GET /decisions/:id payload once loaded
      detailId: null,
      detailFailed: false,
      errors: {},          // decisionId -> "your vote didn't save"
      reported: {},        // "decision:<id>" / "comment:<id>" -> true
      draft: '',           // comment being typed, kept across re-renders
      form: { question: '', choices: ['', ''] },
    };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Every API call carries the token, demo=1 when the page has it, and
    // the staging "as of" time when the bridge provides one.
    function api(path, opts) {
      opts = opts || {};
      var headers = { 'x-usernode-token': TOKEN };
      if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
      if (window.usernode && typeof window.usernode.now === 'function') {
        try { headers['x-usernode-now'] = window.usernode.now(); } catch (e) {}
      }
      var url = '/api' + path;
      if (DEMO) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'demo=1';
      return fetch(url, {
        method: opts.method || 'GET',
        headers: headers,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw { status: res.status, code: data && data.error, data: data };
          return data;
        });
      });
    }

    function samePerson(a, b) { // ids are TEXT in the db, numbers in tokens
      return a != null && b != null && String(a) === String(b);
    }

    function fmtDay(ts) { // meta lines: today, yesterday, 3 days ago, 9 Mar
      var d = new Date(ts), now = new Date();
      var diff = Math.round(
        (new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
         new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
      if (diff <= 0) return 'today';
      if (diff === 1) return 'yesterday';
      if (diff < 7) return diff + ' days ago';
      return d.getDate() + ' ' + MONTHS[d.getMonth()];
    }
    function fmtAgo(ts) { // comments: 2 h ago, 40 min ago
      var s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + ' min ago';
      if (s < 86400) return Math.floor(s / 3600) + ' h ago';
      return fmtDay(ts);
    }
    function fmtWhen(ts) { // closed lines: today, yesterday, then a date (9 Mar)
      var d = new Date(ts), now = new Date();
      var diff = Math.round(
        (new Date(now.getFullYear(), now.getMonth(), now.getDate()) -
         new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
      if (diff <= 0) return 'today';
      if (diff === 1) return 'yesterday';
      return d.getDate() + ' ' + MONTHS[d.getMonth()];
    }

    // ── Signature element: the tally strip ────────────────────────────────
    // One mark per club member, in struck groups of five, like counting
    // hands at a meeting. Filled marks are the accent (calm once closed,
    // via the .closed styles); empty marks stay pale. Without a member
    // count, only the filled marks are drawn.
    function tallyHTML(voted, members) {
      var total = members == null ? Math.max(0, voted) : Math.max(0, members);
      var out = '';
      for (var start = 0; start < total; start += 5) {
        var g = '';
        for (var i = start; i < Math.min(start + 5, total); i++) {
          var cls = [];
          if (i >= voted) cls.push('e');
          else if (i % 5 === 4) cls.push('x'); // struck only when all five are filled
          g += '<i' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '></i>';
        }
        out += '<span class="g">' + g + '</span>';
      }
      return '<div class="tally">' + out + '</div>';
    }

    function votedText(d) {
      var m = state.members;
      return m == null ? d.voter_count + ' voted' : d.voter_count + ' of ' + m + ' voted';
    }

    function optHTML(d, c) {
      var closed = !!d.closed_at;
      var mine = !closed && state.viewer && d.my_choice_id === c.id;
      var win = closed && d.winner_ids && d.winner_ids.indexOf(c.id) >= 0;
      var pct = d.voter_count ? Math.round(c.count * 100 / d.voter_count) : 0;
      var label = closed
        ? (win ? c.count + (c.count === 1 ? ' vote' : ' votes') : String(c.count))
        : (mine ? c.count + ', your vote' : String(c.count));
      var cls = 'opt' + (win ? ' win' : '') + (mine ? ' me' : '');
      return closed
        ? '<div class="' + cls + '"><em style="width:' + pct + '%"></em><b>' + esc(c.label) + '</b><span>' + label + '</span></div>'
        : '<button type="button" class="' + cls + '" data-vote="' + d.id + ':' + c.id + '"><em style="width:' + pct + '%"></em><b>' + esc(c.label) + '</b><span>' + label + '</span></button>';
    }

    var BUBBLE = '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>';
    var PLUS = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';

    function cardHTML(d) {
      var closed = !!d.closed_at;
      var minePost = state.viewer && samePerson(d.author_id, state.viewer.id);
      var meta = closed
        ? '<span>Closed by ' + (minePost ? 'you' : esc(d.author_name)) + ', ' + fmtWhen(d.closed_at) + '</span><span class="badge">' + (d.winner_ids.length > 1 ? 'Tied' : 'Decided') + '</span>'
        : '<span>Posted by ' + (minePost ? 'you' : esc(d.author_name)) + ', ' + fmtDay(d.created_at) + '</span><span>' + (minePost ? 'You close it' : esc(d.author_name) + ' closes it') + '</span>';
      var err = state.errors[d.id]
        ? '<p class="text-small" style="color:rgb(var(--danger));margin:-4px 0 8px">Your vote didn\'t save. Try again.</p>'
        : '';
      var closeBtn = minePost && !closed
        ? '<button type="button" class="btn-secondary" style="width:100%;margin-top:4px" data-close="' + d.id + '">Close vote</button>'
        : '';
      return '<div class="card' + (closed ? ' closed' : '') + '">' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="q">' + esc(d.question) + '</div>' +
        tallyHTML(d.voter_count, state.members) +
        d.choices.map(function (c) { return optHTML(d, c); }).join('') +
        err +
        footHTML(d) +
        closeBtn +
        '</div>';
    }

    function footHTML(d) {
      var m = state.members;
      var txt = m == null ? d.voter_count + ' voted' : d.voter_count + ' of ' + m + ' voted';
      if (!d.closed_at && state.viewer && !d.my_choice_id) txt += ', not you yet';
      return '<div class="foot"><span>' + txt + '</span>' +
        '<a href="#/d/' + d.id + '">' + BUBBLE + d.comment_count + (d.comment_count === 1 ? ' comment' : ' comments') + '</a></div>';
    }

    function skeletonCard() {
      return '<div class="card">' +
        '<div class="skeleton" style="height:14px;width:45%"></div>' +
        '<div class="skeleton" style="height:24px;width:78%;margin:8px 0 12px"></div>' +
        '<div class="skeleton" style="height:22px;width:55%;margin-bottom:12px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:14px;width:50%"></div>' +
        '</div>';
    }
    function loadingHTML(n) {
      var out = '';
      for (var i = 0; i < n; i++) out += skeletonCard();
      return out;
    }

    function renderList() {
      var failed = state.listFailed;
      var d = state.list;
      var empty = d && d.decisions && d.decisions.length === 0;
      var sub = '';
      if (d && !empty) {
        var openN = d.decisions.filter(function (x) { return !x.closed_at; }).length;
        var bits = [openN + ' open decision' + (openN === 1 ? '' : 's')];
        if (state.members != null) bits.push(state.members + ' members');
        sub = '<div class="sub">' + esc(bits.join(', ')) + '</div>';
      }
      var head = '<div class="top"><div><div class="title">Club Votes</div>' +
        (DEMO ? '<div class="sub" data-usernode-demo-note>Staging demo: made-up club decisions</div>' : '') +
        sub + '</div>' +
        ((empty || failed) ? '' : '<button type="button" class="btn-primary" data-nav="#/new">' + PLUS + 'New decision</button>') +
        '</div>';

      var body;
      if (failed) {
        body = '<div class="state-error"><p class="text-body">Couldn\'t load the club\'s decisions.</p>' +
          '<button type="button" class="btn-secondary" data-retry>Retry</button></div>';
      } else if (empty) {
        body = '<div class="state-empty">' +
          '<p class="text-body" style="font-weight:600">No decisions yet.</p>' +
          '<p class="text-small" style="color:rgb(var(--muted))">Post the first thing the club needs to decide.</p>' +
          '<button type="button" class="btn-primary" data-nav="#/new" style="margin-top:8px">Post the first decision</button>' +
          '</div>';
      } else if (!d) {
        body = loadingHTML(3);
      } else {
        var open = d.decisions.filter(function (x) { return !x.closed_at; });
        var decided = d.decisions.filter(function (x) { return x.closed_at; });
        body =
          (open.length ? '<div class="section-label">Open now</div>' + open.map(cardHTML).join('') : '') +
          (decided.length ? '<div class="section-label">Decided</div>' + decided.map(cardHTML).join('') : '');
      }
      app.innerHTML = head + body;
    }

    function detailSkeleton() {
      return '<div class="card">' +
        '<div class="skeleton" style="height:14px;width:45%"></div>' +
        '<div class="skeleton" style="height:24px;width:78%;margin:8px 0 12px"></div>' +
        '<div class="skeleton" style="height:22px;width:55%;margin-bottom:12px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '<div class="skeleton" style="height:44px;margin-bottom:8px"></div>' +
        '</div>' +
        '<div class="skeleton" style="height:20px;width:30%;margin:16px 0 8px"></div>' +
        '<div class="skeleton" style="height:64px"></div>';
    }

    function renderDetail() {
      var data = state.detail;
      var d = data && data.decision;
      var bar = '<div class="bar"><button type="button" class="icon-btn" data-nav="#"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button>' +
        (d && !(state.viewer && samePerson(d.author_id, state.viewer.id))
          ? (state.reported['decision:' + d.id]
              ? '<button type="button" class="icon-btn" disabled>Reported, thanks</button>'
              : '<button type="button" class="icon-btn" data-report="decision:' + d.id + '">Report</button>')
          : '') +
        '</div>';
      if (state.detailFailed) {
        app.innerHTML = bar + '<div class="state-error"><p class="text-body">Couldn\'t load that decision.</p>' +
          '<button type="button" class="btn-secondary" data-retry-detail>Retry</button></div>';
        return;
      }
      if (!d) {
        app.innerHTML = bar + detailSkeleton();
        return;
      }

      var minePost = state.viewer && samePerson(d.author_id, state.viewer.id);
      var closed = !!d.closed_at;
      var votedTxt = votedText(d);
      var subTxt = closed
        ? 'Voting closed. ' + votedTxt + '.'
        : votedTxt + '. ' + (state.viewer
            ? (d.my_choice_id ? 'Tap another choice to change your vote.' : 'Tap a choice to vote.')
            : '');
      var authorBtns =
        (minePost && !closed ? '<button type="button" class="btn-secondary" style="width:100%;margin-top:4px" data-close="' + d.id + '">Close vote</button>' : '') +
        (minePost ? '<button type="button" class="btn-secondary" style="width:100%;margin-top:8px" data-del="' + d.id + '">Delete decision</button>' : '');

      var rows = data.comments.map(function (c) {
        var own = state.viewer && samePerson(c.author_id, state.viewer.id);
        var btn;
        if (own) btn = '<button type="button" data-delc="' + c.id + '">Delete</button>';
        else if (state.reported['comment:' + c.id]) btn = '<button type="button" disabled>Reported, thanks</button>';
        else btn = '<button type="button" data-report="comment:' + c.id + '">Report</button>';
        return '<div class="list-row"><div class="who"><span><b>' + (own ? 'You' : esc(c.author_name)) + '</b>, ' + fmtAgo(c.created_at) + '</span>' + btn + '</div><p>' + esc(c.body) + '</p></div>';
      }).join('');

      var form = state.viewer
        ? '<label class="lbl" for="cbox">Your comment</label>' +
          '<textarea class="field" id="cbox" placeholder="e.g. I can bring snacks">' + esc(state.draft) + '</textarea>' +
          '<p id="cErr" class="text-small" style="color:rgb(var(--danger));margin-top:4px" hidden>Your comment didn\'t save. Try again.</p>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" class="btn-primary" data-comment>Post comment</button></div>'
        : '<p class="sub" style="margin:16px 0 0">Make an account to vote and comment.</p>';

      app.innerHTML = bar +
        '<div class="card' + (d.closed_at ? ' closed' : '') + '">' +
        '<div class="meta">' + (d.closed_at
          ? '<span>Closed by ' + (minePost ? 'you' : esc(d.author_name)) + ', ' + fmtWhen(d.closed_at) + '</span><span class="badge">' + (d.winner_ids.length > 1 ? 'Tied' : 'Decided') + '</span>'
          : '<span>Posted by ' + (minePost ? 'you' : esc(d.author_name)) + ', ' + fmtDay(d.created_at) + '</span><span>' + (minePost ? 'You close it' : esc(d.author_name) + ' closes it') + '</span>') + '</div>' +
        '<div class="q">' + esc(d.question) + '</div>' +
        tallyHTML(d.voter_count, state.members) +
        d.choices.map(function (c) { return optHTML(d, c); }).join('') +
        (state.errors[d.id] ? '<p class="text-small" style="color:rgb(var(--danger));margin:-4px 0 8px">Your vote didn\'t save. Try again.</p>' : '') +
        '<p class="sub" style="margin-top:4px">' + esc(subTxt) + '</p>' +
        '</div>' +
        authorBtns +
        '<div class="section-label">' + d.comment_count + (d.comment_count === 1 ? ' comment' : ' comments') + '</div>' +
        (data.comments.length ? '<div class="list">' + rows + '</div>' : '<p class="sub">No comments yet.</p>') +
        form;
    }

    function renderNew() {
      var f = state.form;
      app.innerHTML =
        '<div class="bar"><button type="button" class="icon-btn" data-nav="#" style="margin-left:-4px">Cancel</button>' +
        '<div class="title" style="font-size:20px;line-height:28px;flex:1;text-align:center;margin-right:44px">New decision</div></div>' +
        '<label class="lbl" for="fq">Question</label>' +
        '<input class="input" id="fq" placeholder="e.g. Where do we meet on Saturday?" value="' + esc(f.question) + '">' +
        '<label class="lbl">Choices</label>' +
        f.choices.map(function (c, i) {
          return '<div class="choice-row"><input class="input" data-choice="' + i + '" placeholder="e.g. Library courtyard" value="' + esc(c) + '">' +
            '<button type="button" class="icon-btn" data-rm="' + i + '" aria-label="Remove choice"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
        }).join('') +
        '<button type="button" class="btn-secondary" data-add style="margin-top:4px">' + PLUS + 'Add a choice</button>' +
        '<p id="fErr" class="text-small" style="color:rgb(var(--danger));margin-top:8px" hidden></p>' +
        '<button type="button" class="btn-primary" data-post style="width:100%;margin-top:8px">Post decision</button>';
      var fq = document.getElementById('fq');
      if (fq && !f.question) fq.focus();
    }

    // ── Actions ───────────────────────────────────────────────────────────
    function withScroll(p) {
      var y = window.scrollY;
      return Promise.resolve(p).then(function () {
        window.scrollTo(0, y);
      });
    }

    // After a vote, close or similar: refetch what the viewer is looking at
    // (the one open decision, or the whole list) and re-render, keeping the
    // scroll position.
    function afterAction(promise, id) {
      return withScroll(promise.then(function () {
        if (state.detail && state.detail.decision && state.detail.decision.id === id) {
          return api('/decisions/' + id).then(function (data) {
            state.viewer = data.viewer;
            state.members = data.member_count;
            state.detail = data;
            renderDetail();
          });
        }
        return loadList();
      })).catch(function (err) { handleActionError(err, id); });
    }

    function handleActionError(err, decisionId) {
      if (err && err.code === 'account_required') return; // the bridge asks for an account
      if (decisionId != null) {
        state.errors[decisionId] = true;
        if (state.list) renderList();
        if (state.detail) renderDetail();
      } else {
        console.warn('action failed', err);
      }
    }

    function loadList() {
      state.list = null;
      state.listFailed = false;
      renderList();
      return api('/decisions').then(function (data) {
        state.viewer = data.viewer;
        state.members = data.member_count;
        state.list = data;
        state.listFailed = false;
        renderList();
      }).catch(function () {
        state.listFailed = true;
        renderList();
      });
    }

    function loadDetail(id) {
      state.detail = null;
      state.detailId = id;
      state.detailFailed = false;
      renderDetail();
      return api('/decisions/' + id).then(function (data) {
        state.viewer = data.viewer;
        state.members = data.member_count;
        state.detail = data;
        state.detailFailed = false;
        renderDetail();
      }).catch(function () {
        if (state.detailId !== id) return;
        state.detailFailed = true;
        renderDetail();
      });
    }

    // ── Events ────────────────────────────────────────────────────────────
    app.addEventListener('click', function (e) {
      var el = e.target.closest('[data-nav],[data-vote],[data-close],[data-del],[data-delc],[data-report],[data-retry],[data-retry-detail],[data-add],[data-rm],[data-post],[data-comment]');
      if (!el) return;
      var act;

      if ((act = el.getAttribute('data-nav')) !== null) { location.hash = act; return; }
      if (el.hasAttribute('data-retry')) { loadList(); return; }
      if (el.hasAttribute('data-retry-detail')) { loadDetail(state.detailId); return; }
      if (el.hasAttribute('data-add')) { readForm(); state.form.choices.push(''); renderNew(); return; }
      if ((act = el.getAttribute('data-rm')) !== null) {
        readForm(); state.form.choices.splice(Number(act), 1);
        if (state.form.choices.length < 2) state.form.choices.push('');
        renderNew(); return;
      }
      if (el.hasAttribute('data-post')) { postDecision(); return; }

      if ((act = el.getAttribute('data-vote')) !== null) {
        var p = act.split(':');
        state.errors[p[0]] = false;
        afterAction(api('/decisions/' + p[0] + '/vote', { method: 'POST', body: { choice_id: Number(p[1]) } }), Number(p[0]))
          .catch(function () {});
        return;
      }
      if ((act = el.getAttribute('data-close')) !== null) {
        afterAction(api('/decisions/' + act + '/close', { method: 'POST', body: {} }), Number(act)).catch(function () {});
        return;
      }
      if ((act = el.getAttribute('data-del')) !== null) {
        if (!confirm('Delete this decision, its votes and its comments?')) return;
        api('/decisions/' + act, { method: 'DELETE' }).then(function () {
          state.detail = null;
          location.hash = '#';
        }).catch(function (err) { console.warn('delete failed', err); });
        return;
      }
      if ((act = el.getAttribute('data-delc')) !== null) {
        api('/comments/' + act, { method: 'DELETE' }).then(function () {
          state.draft = readDraft();
          loadDetail(state.detailId);
        }).catch(function (err) { console.warn('delete failed', err); });
        return;
      }
      if ((act = el.getAttribute('data-report')) !== null) {
        var rp = act.split(':');
        api('/reports', { method: 'POST', body: { kind: rp[0], id: Number(rp[1]) } }).then(function () {
          state.reported[act] = true;
          if (state.detail) withScroll(Promise.resolve(renderDetail()));
        }).catch(function (err) { console.warn('report failed', err); });
        return;
      }
      if (el.hasAttribute('data-comment')) { postComment(); return; }
    });

    app.addEventListener('input', function (e) {
      if (e.target.id === 'fq') state.form.question = e.target.value;
      if (e.target.hasAttribute('data-choice')) state.form.choices[Number(e.target.getAttribute('data-choice'))] = e.target.value;
      if (e.target.id === 'cbox') state.draft = e.target.value;
    });

    function readForm() {
      var fq = document.getElementById('fq');
      if (fq) state.form.question = fq.value;
      app.querySelectorAll('input[data-choice]').forEach(function (inp) {
        state.form.choices[Number(inp.getAttribute('data-choice'))] = inp.value;
      });
    }
    function readDraft() {
      var box = document.getElementById('cbox');
      return box ? box.value : state.draft;
    }

    function postDecision() {
      readForm();
      var f = state.form;
      var choices = f.choices.map(function (c) { return c.trim(); }).filter(Boolean);
      var btnErr = document.getElementById('fErr');
      var fail = function (msg) {
        if (btnErr) { btnErr.hidden = false; btnErr.textContent = msg || 'Your decision didn\'t save. Try again.'; }
      };
      if (!f.question.trim() || choices.length < 2) {
        fail('A question and at least two different choices are needed.');
        return;
      }
      api('/decisions', { method: 'POST', body: { question: f.question, choices: f.choices } }).then(function () {
        state.form = { question: '', choices: ['', ''] };
        location.hash = '#';
      }).catch(function (err) {
        fail(err && err.code && err.code !== 'account_required' ? String(err.code) : null);
      });
    }

    function postComment() {
      var box = document.getElementById('cbox');
      var body = box ? box.value.trim() : '';
      var errEl = document.getElementById('cErr');
      if (!body) { if (errEl) errEl.hidden = false; return; }
      api('/decisions/' + state.detailId + '/comments', { method: 'POST', body: { body: body } }).then(function () {
        state.draft = '';
        withScroll(loadDetail(state.detailId)).catch(function () {});
      }).catch(function (err) {
        if (err && err.code === 'account_required') return;
        if (errEl) errEl.hidden = false;
      });
    }

    // ── Routing ───────────────────────────────────────────────────────────
    function route() {
      var h = location.hash || '';
      if (h === '#/new') { renderNew(); return; }
      var m = h.match(/^#\/d\/(\d+)/);
      if (m) { loadDetail(Number(m[1])); return; }
      loadList();
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>
