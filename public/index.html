  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Club Votes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div>
    <div class="app">
     <header class="top">
      <h1>Club Votes</h1>
      <button class="btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New decision</button>
     </header>
     <section>
      <h2 class="section-label">Open decisions</h2>
      <div class="stack">
       <button class="card">
        <p class="q">Where should we meet in November?</p>
        <p class="by">Posted by you, 2 days ago</p>
        <div class="tally"><i class="s1" style="width:55%"></i><i class="s2" style="width:27%"></i><i class="s3" style="width:18%"></i></div>
        <p class="lead"><b>Library back room leads</b><span>11 votes</span></p>
        <p class="foot"><span class="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>You voted</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>3 comments</span></p>
       </button>
       <button class="card">
        <p class="q">Spring outing: hike, museum or picnic?</p>
        <p class="by">Posted by Chioma, yesterday</p>
        <div class="tally"><i class="s1" style="width:40%"></i><i class="s2" style="width:40%"></i><i class="s3" style="width:20%"></i></div>
        <p class="lead"><b>Hike and Museum are tied</b><span>5 votes</span></p>
        <p class="foot"><span>Not voted yet</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>4 comments</span></p>
       </button>
       <button class="card">
        <p class="q">Move meetings to Thursday evenings?</p>
        <p class="by">Posted by Dev, 3 hours ago</p>
        <div class="tally"><i class="s1" style="width:67%"></i><i class="s2" style="width:33%"></i></div>
        <p class="lead"><b>Yes leads</b><span>3 votes</span></p>
        <p class="foot"><span class="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>You voted</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>No comments</span></p>
       </button>
      </div>
     </section>
     <section>
      <h2 class="section-label">Decided</h2>
      <div class="stack">
       <button class="card done">
        <p class="stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>Decided: Bake sale</p>
        <p class="q">What should our next fundraiser be?</p>
        <p class="by">Closed by Elif, last week</p>
        <div class="tally"><i class="s1" style="width:64%"></i><i class="s2" style="width:36%"></i></div>
        <p class="foot"><span>14 votes</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>9 comments</span></p>
       </button>
      </div>
     </section>
    </div>
    </div>
  </div>
  <!-- Screen 2 as the spec drew it: inert until moved where that view belongs. -->
  <template data-spec-screen="2">
    <div data-spec-screen="2">
      <div>
      <div class="app">
      <article class="kit-detail">
       <header class="kit-detail-head">
        <button class="btn-secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>All decisions</button>
        <h2 class="kit-detail-title">Where should we meet in November?</h2>
        <p class="meta">Posted by you, 2 days ago</p>
        <p class="kit-detail-body">The café is closing for renovations. Pick the place that works for most of us, I will book it once we decide.</p>
       </header>
       <section>
        <h3 class="section-label">Your vote</h3>
        <div class="kit-votes">
         <button class="kit-vote" aria-pressed="true"><span class="kit-vote-fill" style="width:55%"></span><span class="kit-vote-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg></span><span class="kit-vote-label">Library back room</span><span class="kit-vote-count">6</span></button>
         <button class="kit-vote" aria-pressed="false"><span class="kit-vote-fill" style="width:27%"></span><span class="kit-vote-mark"></span><span class="kit-vote-label">Community hall</span><span class="kit-vote-count">3</span></button>
         <button class="kit-vote" aria-pressed="false"><span class="kit-vote-fill" style="width:18%"></span><span class="kit-vote-mark"></span><span class="kit-vote-label">Someone's garden</span><span class="kit-vote-count">2</span></button>
        </div>
        <p class="kit-vote-summary">11 votes, Library back room leads</p>
        <div class="owner">
         <button class="btn-secondary">Close decision</button>
         <button class="btn-secondary">Delete</button>
        </div>
       </section>
       <section>
        <h3 class="section-label">Comments</h3>
        <ul class="kit-group">
         <li class="list-row"><p class="kit-comment-meta"><span class="kit-comment-author">Ana</span><span>yesterday</span><button class="rep">Report</button></p><p>The library room has the projector, which helps for the planning night.</p></li>
         <li class="list-row"><p class="kit-comment-meta"><span class="kit-comment-author">Ben</span><span>yesterday</span><button class="rep">Report</button></p><p>Hall is bigger if more people come back after the summer.</p></li>
         <li class="list-row"><p class="kit-comment-meta"><span class="kit-comment-author">You</span><span>5 hours ago</span><button class="rep">Delete</button></p><p>I can ask the library about Tuesday slots too.</p></li>
        </ul>
        <form class="kit-composer">
         <label class="kit-label">Add a comment</label>
         <div class="field">e.g. The hall has better parking</div>
         <div class="kit-composer-actions"><button class="btn-secondary">Post comment</button></div>
        </form>
       </section>
      </article>
      </div>
      </div>
    </div>
  </template>
  <!-- /usernode-spec-screens@1 -->
</body>
