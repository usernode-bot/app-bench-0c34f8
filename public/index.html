<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- (Named in prose on purpose: Tailwind compiles any class-name word in
       these files, comments included, and the starter should ship only the
       components its screen uses.) -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1" id="view-unread">
    <div class="rss">
    <div class="top" id="top-bar"><div><h1>Unread</h1><p class="sub" id="count-line"></p></div>
    <div class="acts"><button id="btn-feeds" class="btn-secondary" type="button"><svg viewBox="0 0 24 24"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1.5"/></svg>Feeds</button>
    <button id="btn-add" class="btn-primary" type="button"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Add feed</button></div></div>
    <p class="section-label" id="newest-label">Newest first</p>
    <ul class="list" id="post-list"></ul>
    <p class="end" id="caught-up" hidden></p>
    <p class="end" id="refresh-note" hidden></p>
    <!-- Loading has the list's own shape: post cards with skeleton bars
         where their text goes. -->
    <ul class="list" id="state-loading" hidden>
      <li><div class="card" style="--c:var(--line)"><span class="skeleton mb-2 block h-4 w-32"></span><span class="skeleton mb-2 block h-5 w-3/4"></span><span class="skeleton block h-4 w-full"></span></div></li>
      <li><div class="card" style="--c:var(--line)"><span class="skeleton mb-2 block h-4 w-24"></span><span class="skeleton mb-2 block h-5 w-2/3"></span><span class="skeleton block h-4 w-5/6"></span></div></li>
      <li><div class="card" style="--c:var(--line)"><span class="skeleton mb-2 block h-4 w-28"></span><span class="skeleton mb-2 block h-5 w-3/5"></span><span class="skeleton block h-4 w-full"></span></div></li>
      <li><div class="card" style="--c:var(--line)"><span class="skeleton mb-2 block h-4 w-32"></span><span class="skeleton mb-2 block h-5 w-3/4"></span><span class="skeleton block h-4 w-4/5"></span></div></li>
      <li><div class="card" style="--c:var(--line)"><span class="skeleton mb-2 block h-4 w-24"></span><span class="skeleton mb-2 block h-5 w-1/2"></span><span class="skeleton block h-4 w-2/3"></span></div></li>
    </ul>
    <div id="state-empty" class="state-empty" hidden>
      <h2>No feeds yet</h2>
      <p class="ex">Add a feed and its unread posts will gather here.</p>
      <button id="empty-add" class="btn-primary" type="button">Add your first feed</button>
    </div>
    <div id="state-error" class="state-error" hidden>
      <h2>Something went wrong</h2>
      <p class="ex" id="error-message"></p>
      <button id="btn-retry" class="btn-primary" type="button">Retry</button>
    </div>
    </div>
  </div>
  <!-- Screen 2 as the spec drew it, now the post preview view; its values
       are filled from the tapped post. -->
  <section id="view-post" data-spec-screen hidden>
    <div class="rss">
    <div class="bar"><button id="post-back" class="ghost" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Unread</button></div>
    <div class="art" id="post-art" style="--c:var(--feed-2)">
    <p class="src" id="post-src"></p>
    <h2 id="post-title"></h2>
    <p class="when" id="post-when"></p>
    </div>
    <div class="body" id="post-body"></div>
    <div class="foot">
    <p class="note" id="post-note"></p>
    <a id="post-link" class="btn-primary" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open full article</a>
    </div>
    </div>
  </section>
  <!-- The Feeds view: see and remove what you added. -->
  <section id="view-feeds" data-spec-screen hidden>
    <div class="rss">
    <div class="bar"><button id="feeds-back" class="ghost" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Unread</button><button id="feeds-add" class="btn-primary" type="button"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Add feed</button></div>
    <h1 class="px-4">Feeds</h1>
    <ul class="list" id="feeds-list"></ul>
    </div>
  </section>
  <!-- The one post row as the spec drew it, cloned for each post. -->
  <template id="post-row-tpl"><li><a class="card post-card"><div class="meta"><b></b><span></span></div><p class="t"></p><p class="ex"></p></a></li></template>
  <!-- The Add feed sheet: Cancel, the title and Add stay above the
       keyboard on a phone. -->
  <div id="sheet-backdrop" hidden class="fixed inset-0 z-40 bg-fg/40">
    <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" class="absolute inset-x-0 bottom-0 mx-auto w-full max-w-2xl border-t border-line bg-surface p-4 pb-8">
      <div class="mb-3 flex items-center justify-between gap-2">
        <button id="sheet-cancel" class="btn-secondary" type="button">Cancel</button>
        <h2 id="sheet-title" class="text-heading">Add feed</h2>
        <button id="sheet-add" class="btn-primary" type="button">Add</button>
      </div>
      <label class="section-label block" for="feed-url">Feed address</label>
      <input id="feed-url" class="field" type="url" inputmode="url" autocomplete="off" placeholder="e.g. https://example.com/feed.xml">
      <p id="sheet-error" class="mt-2 text-small" style="color:rgb(var(--danger))" hidden></p>
    </div>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
