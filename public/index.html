<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><g fill='none' stroke='white' stroke-width='9' stroke-linecap='round'><path d='M27 61a23 23 0 0 1 23 23'/><path d='M27 39a45 45 0 0 1 45 45'/></g><circle cx='29' cy='82' r='7' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. CLAUDE.md's "## Design" says how. -->
  <!-- usernode-spec-screens@1: the screens the spec drew, wired to real data
       by public/app.js. The drawn rows were the populated demo; the same
       markup is now rendered from the API, and ?demo=1 fills it the same
       way. -->
  <div data-spec-screen="1">
    <div>
    <div class="app">
    <div class="top"><div><h1>RSS Reader</h1><div class="sub" id="status" hidden></div></div>
    <div class="acts"><button class="btn-secondary icon" id="feeds-btn" aria-label="Your feeds"><svg viewBox="0 0 24 24"><path d="M5 11a8 8 0 0 1 8 8M5 5a14 14 0 0 1 14 14"/><circle cx="6" cy="18" r="1"/></svg></button>
    <button class="btn-primary" id="add-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add feed</button></div></div>
    <div class="sub" data-usernode-demo-note id="demo-note" hidden>Staging demo: sample feeds and posts</div>
    <div class="tabs"><button class="tab on" data-view="unread" type="button">Unread <span class="count" id="count-unread"></span></button><button class="tab" data-view="saved" type="button">Saved <span class="count" id="count-saved"></span></button><button class="tab" data-view="all" type="button">All</button></div>
    <div class="chips" id="feeds-chips" hidden></div>
    <div id="content"></div>
    </div>

    <div class="scrim" id="add-scrim" data-live hidden></div>
    <div class="sheet" id="add-sheet" data-live hidden>
    <div class="grab"></div>
    <div class="bar"><button class="ghost" id="add-cancel" type="button">Cancel</button>
    <div class="t">Add feed</div>
    <button class="btn-primary" id="add-submit" type="button">Add</button></div>
    <div style="margin-top:16px"><label class="section-label" for="add-url">Feed address</label>
    <input class="field" id="add-url" type="url" inputmode="url" placeholder="e.g. https://example.com/feed.xml">
    <div class="note" id="add-error" hidden></div></div>
    </div>

    <div class="scrim" id="feeds-scrim" data-live hidden></div>
    <div class="sheet" id="feeds-sheet" data-live hidden>
    <div class="grab"></div>
    <div class="bar"><div class="t">Your feeds</div>
    <button class="ghost" id="feeds-close" aria-label="Close" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="list" id="feeds-list" style="margin-top:16px"></ul>
    </div>

    <div class="scrim" id="preview-scrim" data-live hidden></div>
    <div class="sheet" id="preview-sheet" data-live hidden>
    <div class="grab"></div>
    <div class="bar"><div class="meta" style="display:flex;align-items:center;gap:6px"><i class="dot" id="pv-dot"></i><span id="pv-meta"></span></div>
    <button class="ghost" id="pv-close" aria-label="Close" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <h2 id="pv-title"></h2>
    <p id="pv-excerpt"></p>
    <div class="note" id="pv-note" hidden>Marked as read</div>
    <div class="row"><a class="btn-primary" id="pv-open" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open full article</a><button class="btn-secondary" id="pv-save" type="button"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg><span id="pv-save-label">Save</span></button></div>
    <div style="display:flex;justify-content:center;margin-top:8px"><button class="ghost" id="pv-unread" type="button">Mark as unread</button></div>
    </div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script src="/app.js"></script>
</body>
</html>
