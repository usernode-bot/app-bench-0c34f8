  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"><\/script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>

  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var demo = new URLSearchParams(location.search).get('demo') === '1';
    var tab = 'open';
    var listData = null;      // the last list response
    var loadedOnce = false;
    var currentDetail = null; // the last detail response
    var noticeTimer = null;

    // ── API ── demo=1 is passed on to every call, as the spec asks. The
    // platform's token, minted into the iframe URL on load, is forwarded
    // via x-usernode-token on every subsequent fetch. ──
    var token = new URLSearchParams(location.search).get('token') || '';
    function api(path, opts) {
      opts = opts || {};
      path = '/api' + path;
      opts.headers = Object.assign(
        token ? { 'x-usernode-token': token } : {},
        opts.headers || {}
      );
      if (demo) path += (path.indexOf('?') === -1 ? '?' : '&') + 'demo=1';
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      return fetch(path, opts).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) {
            var err = new Error((data && data.error) || ('HTTP ' + res.status));
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
    }

    function now() {
      try {
        if (window.usernode && typeof window.usernode.now === 'function') {
          var n = window.usernode.now();
          if (n && n.getTime) return n.getTime();
        }
      } catch (e) {}
      return Date.now();
    }

    function rel(iso) {
      var t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      var s = Math.max(1, Math.round((now() - t) / 1000));
      if (s < 60) return 'just now';
      if (s < 3600) { return Math.floor(s / 60) + ' min ago'; }
      if (s < 86400) { var h = Math.floor(s / 3600); return h === 1 ? 'an hour ago' : h + ' hours ago'; }
      var d = Math.floor(s / 86400);
      if (d === 1) return 'yesterday';
      if (d < 30) return d + ' days ago';
      var w = Math.floor(d / 7);
      return w === 1 ? 'a week ago' : w + ' weeks ago';
    }

    function resultOf(d) {
      if (d.yes_count > d.no_count) return 'Yes ' + d.yes_count;
      if (d.no_count > d.yes_count) return 'No ' + d.no_count;
      return 'Tied at ' + d.yes_count;
    }

    // "9 of 12 voted" against the club's member list; just "9 voted" when
    // the list cannot be read.
    function votedLine(d, memberCount) {
      var n = d.yes_count + d.no_count;
      if (!n) return 'No votes yet';
      return memberCount ? n + ' of ' + memberCount + ' voted' : n + ' voted';
    }

    // The tally bar: green and red filling left to right against the light
    // track of the members who have not voted yet.
    function setBar(barY, barN, d, memberCount) {
      var denom = memberCount || (d.yes_count + d.no_count) || 1;
      barY.style.width = Math.round(100 * d.yes_count / denom) + '%';
      barN.style.width = Math.round(100 * d.no_count / denom) + '%';
    }

    function notice(el, msg) {
      if (!el) return;
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(function () { el.hidden = true; }, 4000);
    }

    function showView(name) {
      $('view-list').hidden = name !== 'list';
      $('view-detail').hidden = name !== 'detail';
      $('view-new').hidden = name !== 'new';
      try { window.scrollTo(0, 0); } catch (e) {}
    }

    // ── The list ──
    var listSeq = 0;
    function loadList() {
      var seq = ++listSeq;
      $('hdr-sub').hidden = false;
      $('hdr-sub').textContent = 'Loading…';
      $('list-loading').hidden = false;
      $('list-error').hidden = true;
      $('list-empty').hidden = true;
      $('cards').textContent = '';
      $('closed-wrap').hidden = true;
      api('/decisions?tab=' + tab).then(function (data) {
        if (seq !== listSeq) return;
        loadedOnce = true;
        renderList(data);
      }).catch(function () {
        if (seq !== listSeq) return;
        $('list-loading').hidden = true;
        $('hdr-sub').hidden = true;
        $('hdr-sub').textContent = '';
        $('cards').textContent = '';
        $('closed-wrap').hidden = true;
        $('list-error').hidden = false;
      });
    }

    function renderList(data) {
      listData = data;
      $('list-loading').hidden = true;
      $('list-error').hidden = true;
      $('demo-line').hidden = !data.demo;
      if (data.open_count > 0) {
        var parts = [data.open_count === 1 ? '1 open' : data.open_count + ' open'];
        if (data.waiting_count > 0) {
          parts.push(data.waiting_count === 1 ? '1 waiting on your vote' : data.waiting_count + ' waiting on your vote');
        }
        $('hdr-sub').hidden = false;
        $('hdr-sub').textContent = parts.join(', ');
      } else {
        $('hdr-sub').hidden = true;
        $('hdr-sub').textContent = '';
      }

      var ds = data.decisions || [];
      if (!ds.length) {
        $('cards').textContent = '';
        $('empty-title').textContent =
          tab === 'mine' ? 'You have not posted a decision yet.' :
          tab === 'closed' ? 'Nothing has been closed yet.' :
          'Nothing to decide yet.';
        $('list-empty').hidden = false;
        return;
      }
      $('list-empty').hidden = true;
      renderCards(ds, data.member_count);
      if (tab === 'open' && data.recent_closed && data.recent_closed.length) {
        renderClosed(data.recent_closed);
        $('closed-wrap').hidden = false;
      } else {
        $('closed-wrap').hidden = true;
      }
    }

    function commentLine(d) {
      if (!d.comment_count) return 'No comments yet';
      var base = d.comment_count === 1 ? '1 comment' : d.comment_count + ' comments';
      if (!d.latest_commenter) return base;
      return base + ', latest from ' + (d.latest_is_mine ? 'you' : d.latest_commenter);
    }

    function renderCards(ds, memberCount) {
      var wrap = $('cards');
      wrap.textContent = '';
      ds.forEach(function (d) {
        var node = $('card-tmpl').content.firstElementChild.cloneNode(true);
        node.querySelector('.c-meta').textContent = (d.is_mine ? 'You' : d.author_username) + ', ' + rel(d.created_at);
        node.querySelector('.c-voted').textContent = votedLine(d, memberCount);
        node.querySelector('.c-q').textContent = d.question;
        setBar(node.querySelector('.c-bar-y'), node.querySelector('.c-bar-n'), d, memberCount);
        node.querySelector('.c-yes').textContent = d.yes_count;
        node.querySelector('.c-no').textContent = d.no_count;
        var yes = node.querySelector('.c-vote-yes'), no = node.querySelector('.c-vote-no');
        yes.classList.toggle('sel', d.my_vote === 'yes');
        no.classList.toggle('seln', d.my_vote === 'no');
        if (d.closed_at) {
          var act = node.querySelector('.act');
          act.textContent = '';
          var res = document.createElement('span');
          res.className = 'res';
          res.textContent = resultOf(d);
          act.appendChild(res);
        } else {
          yes.addEventListener('click', function (e) { e.stopPropagation(); cardVote(node, d, 'yes', memberCount); });
          no.addEventListener('click', function (e) { e.stopPropagation(); cardVote(node, d, 'no', memberCount); });
        }
        node.querySelector('.c-cm').textContent = commentLine(d);
        if (!d.is_mine) {
          var rep = addReport(node.querySelector('.cm'), 'decision', d.id, function () {});
          rep.style.marginLeft = 'auto';
        }
        node.addEventListener('click', function () { location.hash = '#/d/' + d.id; });
        wrap.appendChild(node);
      });
    }

    // Optimistic vote: the tally bar fills straight away, and a failed save
    // puts the card back as it was and says so.
    function cardVote(node, d, choice, memberCount) {
      var target = choice === d.my_vote ? null : choice;
      var prev = { y: d.yes_count, n: d.no_count, v: d.my_vote };
      var ny = d.yes_count, nn = d.no_count;
      if (target === 'yes') { if (d.my_vote === 'no') nn--; ny++; }
      else if (target === 'no') { if (d.my_vote === 'yes') ny--; nn++; }
      else { if (d.my_vote === 'yes') ny--; if (d.my_vote === 'no') nn--; }
      applyCardVote(node, { my_vote: target, yes_count: ny, no_count: nn }, memberCount);
      api('/decisions/' + d.id + '/vote', { method: 'PUT', body: JSON.stringify({ choice: target }) })
        .then(function (counts) {
          d.my_vote = counts.my_vote;
          d.yes_count = counts.yes_count;
          d.no_count = counts.no_count;
          applyCardVote(node, d, memberCount);
        })
        .catch(function (err) {
          d.my_vote = prev.v; d.yes_count = prev.y; d.no_count = prev.n;
          applyCardVote(node, d, memberCount);
          notice($('notice-list'), err.status === 401
            ? 'Make an account to vote.' : 'Your vote could not be saved.');
        });
    }

    function applyCardVote(node, d, memberCount) {
      node.querySelector('.c-vote-yes').classList.toggle('sel', d.my_vote === 'yes');
      node.querySelector('.c-vote-no').classList.toggle('seln', d.my_vote === 'no');
      node.querySelector('.c-yes').textContent = d.yes_count;
      node.querySelector('.c-no').textContent = d.no_count;
      setBar(node.querySelector('.c-bar-y'), node.querySelector('.c-bar-n'), d, memberCount);
      node.querySelector('.c-voted').textContent = votedLine(d, memberCount);
    }

    function renderClosed(rows) {
      var wrap = $('closed-list');
      wrap.textContent = '';
      rows.forEach(function (d) {
        var node = $('closed-tmpl').content.firstElementChild.cloneNode(true);
        node.querySelector('.r-q').textContent = d.question;
        node.querySelector('.r-sub').textContent = 'Closed by ' +
          (d.is_mine ? 'you' : d.author_username) + ', ' + (d.yes_count + d.no_count) + ' votes';
        var res = node.querySelector('.r-res');
        res.textContent = resultOf(d);
        if (d.no_count > d.yes_count) res.classList.add('no');
        node.addEventListener('click', function () { location.hash = '#/d/' + d.id; });
        wrap.appendChild(node);
      });
    }

    // Report: records it for the club's admins and changes nothing on
    // screen beyond "Reported, thanks".
    function addReport(host, targetType, targetId, onDone) {
      if (!host) return onDone();
      var rep = document.createElement('button');
      rep.type = 'button';
      rep.className = 'lnk m';
      rep.textContent = 'Report';
      rep.addEventListener('click', function (e) {
        e.stopPropagation();
        rep.disabled = true;
        rep.textContent = 'Reporting…';
        api('/reports', { method: 'POST', body: JSON.stringify({ target_type: targetType, target_id: targetId }) })
          .then(function () { rep.textContent = 'Reported, thanks'; onDone(); })
          .catch(function (err) {
            rep.disabled = false;
            rep.textContent = 'Report';
            if (err.status !== 401) notice($('notice-list'), 'The report could not be sent.');
          });
      });
      host.appendChild(rep);
      return rep;
    }

    // ── The opened decision ──
    var detailSeq = 0;
    function loadDetail(id) {
      var seq = ++detailSeq;
      $('d-q').textContent = 'Loading…';
      $('d-meta').textContent = '';
      $('d-det').hidden = true;
      $('d-card').hidden = true;
      $('d-retry').hidden = true;
      $('d-form').hidden = true;
      $('d-cm-label').textContent = 'Comments';
      $('d-comments').textContent = '';
      $('demo-line-d').hidden = true;
      api('/decisions/' + id).then(function (data) {
        if (seq !== detailSeq) return;
        currentDetail = data;
        renderDetail(data);
      }).catch(function () {
        if (seq !== detailSeq) return;
        currentDetail = null;
        $('d-q').textContent = 'The decision could not be loaded.';
        $('d-retry').hidden = false;
      });
    }

    function renderDetail(data) {
      var d = data.decision;
      var memberCount = data.member_count;
      var closed = !!d.closed_at;
      $('d-card').hidden = false;
      $('d-form').hidden = false;
      $('d-retry').hidden = true;
      $('demo-line-d').hidden = !data.demo;
      $('d-meta').textContent = 'Posted by ' + (d.is_mine ? 'you' : d.author_username) + ', ' + rel(d.created_at);
      $('d-q').textContent = d.question;
      $('d-det').hidden = !d.details;
      $('d-det').textContent = d.details;
      setBar($('d-bar-y'), $('d-bar-n'), d, memberCount);
      $('d-yes').textContent = d.yes_count;
      $('d-no').textContent = d.no_count;
      $('d-voted').textContent = closed ? resultOf(d) : votedLine(d, memberCount);
      $('d-vote-yes').classList.toggle('sel', d.my_vote === 'yes');
      $('d-vote-no').classList.toggle('seln', d.my_vote === 'no');
      $('d-act').hidden = closed;
      $('d-hint').textContent = closed ? 'Voting is closed.' :
        d.my_vote === 'yes' ? 'You voted Yes. You can change your vote until it closes.' :
        d.my_vote === 'no' ? 'You voted No. You can change your vote until it closes.' :
        'You have not voted. You can change your vote until it closes.';
      $('d-own').hidden = !d.is_mine;
      $('btn-close').hidden = closed;
      $('btn-report').hidden = d.is_mine;
      $('btn-report').disabled = false;
      $('btn-report').textContent = 'Report';
      renderComments(data);
    }

    function renderComments(data) {
      var wrap = $('d-comments');
      wrap.textContent = '';
      data.comments.forEach(function (c) {
        var node = $('comment-tmpl').content.firstElementChild.cloneNode(true);
        node.dataset.id = c.id;
        node.querySelector('.w-name').textContent = c.is_mine ? 'You' : c.author_username;
        node.querySelector('.w-when').textContent = rel(c.created_at);
        var vt = node.querySelector('.w-vt');
        if (c.author_vote) {
          vt.textContent = c.author_vote === 'yes' ? 'Yes' : 'No';
          vt.hidden = false;
        }
        node.querySelector('.w-body').textContent = c.body;
        var rep = node.querySelector('.w-report'), del = node.querySelector('.w-del');
        if (c.is_mine) {
          rep.hidden = true;
          del.hidden = false;
          del.addEventListener('click', function () {
            del.disabled = true;
            api('/comments/' + c.id, { method: 'DELETE' }).then(function () {
              data.comments = data.comments.filter(function (x) { return x.id !== c.id; });
              var d = data.decision;
              d.comment_count = (d.comment_count || 0) - 1;
              syncListDecision(d.id, { comment_count: d.comment_count });
              renderComments(data);
            }).catch(function () {
              del.disabled = false;
              notice($('notice-detail'), 'Your comment could not be deleted.');
            });
          });
        } else {
          rep.addEventListener('click', function (e) {
            e.stopPropagation();
            rep.disabled = true;
            rep.textContent = 'Reporting…';
            api('/reports', { method: 'POST', body: JSON.stringify({ target_type: 'comment', target_id: c.id }) })
              .then(function () { rep.textContent = 'Reported, thanks'; })
              .catch(function () { rep.disabled = false; rep.textContent = 'Report'; });
          });
        }
        wrap.appendChild(node);
      });
      var n = data.comments.length;
      $('d-cm-label').textContent = n === 1 ? '1 comment' : n + ' comments';
    }

    function syncListDecision(id, patch) {
      if (!listData) return;
      (listData.decisions || []).concat(listData.recent_closed || []).forEach(function (d) {
        if (d.id === id) Object.assign(d, patch);
      });
    }

    // The detail's own vote: same optimistic fill, same rollback.
    function detailVote(choice) {
      if (!currentDetail) return;
      var d = currentDetail.decision;
      var target = choice === d.my_vote ? null : choice;
      var prev = { y: d.yes_count, n: d.no_count, v: d.my_vote };
      var ny = d.yes_count, nn = d.no_count;
      if (target === 'yes') { if (d.my_vote === 'no') nn--; ny++; }
      else if (target === 'no') { if (d.my_vote === 'yes') ny--; nn++; }
      else { if (d.my_vote === 'yes') ny--; if (d.my_vote === 'no') nn--; }
      d.my_vote = target; d.yes_count = ny; d.no_count = nn;
      renderDetail(currentDetail);
      api('/decisions/' + d.id + '/vote', { method: 'PUT', body: JSON.stringify({ choice: target }) })
        .then(function (counts) {
          d.my_vote = counts.my_vote; d.yes_count = counts.yes_count; d.no_count = counts.no_count;
          syncListDecision(d.id, { my_vote: counts.my_vote, yes_count: counts.yes_count, no_count: counts.no_count });
          renderDetail(currentDetail);
        })
        .catch(function (err) {
          d.my_vote = prev.v; d.yes_count = prev.y; d.no_count = prev.n;
          renderDetail(currentDetail);
          notice($('notice-detail'), err.status === 401
            ? 'Make an account to vote.' : 'Your vote could not be saved.');
        });
    }

    // ── Wiring ──
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]');
      if (!b) return;
      tab = b.dataset.tab;
      Array.prototype.forEach.call($('tabs').children, function (t) {
        t.classList.toggle('on', t === b);
        t.setAttribute('aria-selected', t === b ? 'true' : 'false');
      });
      loadList();
    });

    $('btn-retry').addEventListener('click', loadList);
    $('btn-first').addEventListener('click', function () { location.hash = '#/new'; });
    $('btn-new').addEventListener('click', function () { location.hash = '#/new'; });
    $('btn-cancel').addEventListener('click', function () { location.hash = '#/'; });
    $('btn-back').addEventListener('click', function () { location.hash = '#/'; });
    $('d-retry').addEventListener('click', function () { loadDetail(location.hash.slice(4)); });

    function postDecision() {
      var q = $('n-q').value.trim();
      var det = $('n-det').value.trim();
      if (!q) { notice($('notice-new'), 'Write a question first.'); return; }
      $('btn-post-bottom').disabled = true;
      api('/decisions', { method: 'POST', body: JSON.stringify({ question: q, details: det }) })
        .then(function () {
          $('n-q').value = '';
          $('n-det').value = '';
          $('btn-post-bottom').disabled = false;
          tab = 'open';
          Array.prototype.forEach.call($('tabs').children, function (t) {
            t.classList.toggle('on', t.dataset.tab === 'open');
            t.setAttribute('aria-selected', t.dataset.tab === 'open' ? 'true' : 'false');
          });
          if (location.hash === '#/new' || location.hash === '') location.hash = '#/';
          loadList();
        })
        .catch(function () {
          $('btn-post-bottom').disabled = false;
          notice($('notice-new'), 'The decision could not be posted.');
        });
    }
    $('btn-post-bottom').addEventListener('click', postDecision);

    $('d-vote-yes').addEventListener('click', function () { detailVote('yes'); });
    $('d-vote-no').addEventListener('click', function () { detailVote('no'); });

    $('btn-close').addEventListener('click', function () {
      if (!currentDetail) return;
      var d = currentDetail.decision;
      api('/decisions/' + d.id + '/close', { method: 'POST' })
        .then(function () {
          d.closed_at = new Date(now()).toISOString();
          syncListDecision(d.id, { closed_at: d.closed_at });
          renderDetail(currentDetail);
          loadList(); // it has moved to Closed
        })
        .catch(function () { notice($('notice-detail'), 'The decision could not be closed.'); });
    });

    $('btn-del').addEventListener('click', function () {
      if (!currentDetail) return;
      var d = currentDetail.decision;
      if (!window.confirm('Delete this decision with its votes and comments?')) return;
      api('/decisions/' + d.id, { method: 'DELETE' })
        .then(function () {
          currentDetail = null;
          location.hash = '#/';
          loadList();
        })
        .catch(function () { notice($('notice-detail'), 'The decision could not be deleted.'); });
    });

    $('btn-report').addEventListener('click', function () {
      if (!currentDetail) return;
      var b = $('btn-report');
      b.disabled = true;
      b.textContent = 'Reporting…';
      api('/reports', { method: 'POST', body: JSON.stringify({ target_type: 'decision', target_id: currentDetail.decision.id }) })
        .then(function () { b.textContent = 'Reported, thanks'; })
        .catch(function () { b.disabled = false; b.textContent = 'Report'; });
    });

    $('btn-comment').addEventListener('click', function () {
      if (!currentDetail) return;
      var field = $('d-comment');
      var body = field.value.trim();
      if (!body) { notice($('notice-detail'), 'Write a comment first.'); return; }
      $('btn-comment').disabled = true;
      api('/decisions/' + currentDetail.decision.id + '/comments', { method: 'POST', body: JSON.stringify({ body: body }) })
        .then(function (r) {
          field.value = '';
          $('btn-comment').disabled = false;
          currentDetail.comments.push({
            id: r.id,
            author_username: '',
            is_mine: true,
            body: body,
            created_at: new Date(now()).toISOString(),
            author_vote: currentDetail.decision.my_vote,
          });
          currentDetail.decision.comment_count = (currentDetail.decision.comment_count || 0) + 1;
          syncListDecision(currentDetail.decision.id, { comment_count: currentDetail.decision.comment_count });
          renderComments(currentDetail);
        })
        .catch(function (err) {
          $('btn-comment').disabled = false;
          notice($('notice-detail'), err.status === 401
            ? 'Make an account to comment.' : 'Your comment could not be saved.');
        });
    });

    // ── Hash routing: #/ the list, #/d/<id> an opened decision, #/new ──
    function route() {
      var h = location.hash || '#/';
      var m = h.match(/^#\/d\/(\d+)$/);
      if (m) {
        showView('detail');
        loadDetail(m[1]);
      } else if (h === '#/new') {
        showView('new');
      } else {
        showView('list');
        if (!loadedOnce) loadList();
      }
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
  <!-- /usernode-spec-screens@1 -->
</body>
</html>
