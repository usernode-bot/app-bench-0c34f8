<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>RSS Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230E5E66'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- The platform's native-feel UI kit (panels, modals, toasts, alerts),
       also centrally hosted, also by relative path. Its look is themed to
       this app's tokens by the .theme-un block in styles/tailwind-input.css. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      document.documentElement.classList.add('theme-un');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- The reader, built from the design kit in styles/tailwind-input.css.
       CLAUDE.md's "## Design" describes the look: petrol-teal accent, warm
       grey neutrals, serif reading type, and the feed dot as the one
       signature element. -->
  <div class="mx-auto w-full max-w-2xl px-4 pb-16">
    <header class="flex items-center justify-between gap-4 pb-2 pt-5">
      <h1 class="text-title font-serif">RSS Reader</h1>
      <button id="add-feed-btn" type="button" class="btn-primary">Add feed</button>
    </header>

    <!-- Shown only in the staging demo preview (/?demo=1). -->
    <p id="demo-note" hidden class="text-small text-muted">Staging demo feeds, view only.</p>

    <div class="flex flex-wrap items-center gap-2 py-2">
      <p id="count-line" class="flex-1 text-small text-muted"></p>
      <button id="refresh-btn" type="button" class="btn-secondary" hidden>Refresh</button>
      <button id="mark-all-btn" type="button" class="btn-secondary" hidden>Mark all read</button>
    </div>

    <!-- Named above the list when a feed could not be refreshed. -->
    <div id="failed-note" hidden class="mb-2 rounded-lg bg-raised px-3 py-2 text-small text-muted"></div>

    <main>
      <!-- Loading: grey placeholder rows where the posts will be. -->
      <ul id="skeleton-list" class="list" hidden>
        <li class="list-row items-start"><div class="skeleton h-8 w-8 flex-none rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/3"></div></div></li>
        <li class="list-row items-start"><div class="skeleton h-8 w-8 flex-none rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="skeleton h-4 w-2/3"></div><div class="skeleton h-3 w-1/4"></div></div></li>
        <li class="list-row items-start"><div class="skeleton h-8 w-8 flex-none rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="skeleton h-4 w-5/6"></div><div class="skeleton h-3 w-2/5"></div></div></li>
        <li class="list-row items-start"><div class="skeleton h-8 w-8 flex-none rounded-full"></div><div class="flex-1 space-y-2 py-1"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/3"></div></div></li>
      </ul>

      <!-- Empty, only after a successful load that found no feeds. -->
      <div id="state-empty" class="state-empty" hidden>
        <h2 class="text-heading font-serif">No feeds yet</h2>
        <p class="text-body text-muted">Add an RSS or Atom feed and its new posts show up here.</p>
        <button id="empty-add-btn" type="button" class="btn-primary mt-2">Add feed</button>
      </div>

      <!-- Feeds exist but nothing unread. -->
      <div id="state-caught-up" class="state-empty" hidden>
        <h2 class="text-heading font-serif">You&rsquo;re all caught up</h2>
        <p class="text-body text-muted">Every post shown has been read.</p>
        <button id="caught-up-refresh-btn" type="button" class="btn-secondary mt-2">Refresh</button>
      </div>

      <!-- Error, only when the load itself failed. -->
      <div id="state-error" class="state-error" hidden>
        <h2 class="text-heading font-serif">Couldn&rsquo;t load your posts</h2>
        <p class="text-body text-muted">Your feeds are still saved.</p>
        <button id="retry-btn" type="button" class="btn-secondary mt-2">Retry</button>
      </div>

      <!-- The unread list itself: feed dot, title, feed name and date. -->
      <ul id="post-list" class="list" hidden></ul>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
