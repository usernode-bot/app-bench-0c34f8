<!DOCTYPE html>
<html lang="en">
<head>

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Block World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6l40 23v42L50 94 10 71V29z' fill='%23c2410c'/><path d='M50 6l40 23-40 23-40-23z' fill='%23fb923c'/><path d='M50 52v42L10 71V29z' fill='%239a3412'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Wired here to the live world: the drawn view is the 3D canvas host, the
       drawn values are sample data replaced from /api/world and the stream. -->
  <div data-spec-screen="1">
    <div>
    <div class="bw">
    <div class="view" id="touch"><canvas id="world" aria-label="The shared block world"></canvas></div>
    <div class="top"><div class="pill">Block World</div><div class="pill"><span class="dot"></span><span id="here">Just you</span></div></div>
    <p class="top-note" data-usernode-demo-note hidden>Staging demo</p>
    <div class="tag" id="builder-note" hidden></div>
    <div class="top-note warn" id="reconnect-note" hidden>Reconnecting…</div>
    <div class="center-note" id="loading">Loading the world</div>
    <div class="center-note" id="empty" hidden>Nothing built yet. Tap the grass to place a block.</div>
    <div class="center-note" id="edit-fail" hidden></div>
    <div class="center-note" id="guest-note" hidden>Sign in to Homeroom to build</div>
    <div class="center-note" id="state-error" hidden><span>Couldn't load the world. Check your connection.</span><button class="btn-primary" id="retry" type="button">Retry</button></div>
    <div class="center-note" id="state-webgl" hidden>This device can't show the 3D world.</div>
    <div class="tools">
    <button class="tb on" id="tool-place" type="button" aria-label="Place" aria-pressed="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M12 12v9M12 12L4 8M12 12l8-4"/></svg></button>
    <button class="tb" id="tool-break" type="button" aria-label="Break" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="gap"></div>
    <button class="tb" id="fly-up" type="button" aria-label="Fly up"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="tb" id="fly-down" type="button" aria-label="Fly down"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="stick" id="stick" aria-label="Move"><div class="knob" id="knob"></div></div>
    <div class="pal">
    <div class="ph"><b id="pal-name">Grass</b><span id="pal-mode">Placing</span></div>
    <div class="row" id="palette">
    <button class="sw sel" type="button" data-type="grass"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(40 90 30)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(100 170 76)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(146 98 54)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(120 80 44)"/></svg>Grass</button>
    <button class="sw" type="button" data-type="stone"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(60 60 64)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(160 160 164)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(130 130 134)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(105 105 110)"/></svg>Stone</button>
    <button class="sw" type="button" data-type="wood"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(80 50 20)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(190 140 84)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(150 100 56)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(120 78 40)"/></svg>Wood</button>
    <button class="sw" type="button" data-type="glass"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(60 120 150)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(200 232 244)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(160 210 230)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(130 190 215)"/></svg>Glass</button>
    <button class="sw" type="button" data-type="brick"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(100 36 26)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(196 92 70)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(166 70 52)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(140 56 42)"/></svg>Brick</button>
    <button class="sw" type="button" data-type="sand"><svg width="30" height="30" viewBox="0 0 24 24" stroke="rgb(140 110 50)" stroke-width="1" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z" fill="rgb(236 214 150)"/><path d="M4 7l8 4v10l-8-4z" fill="rgb(216 190 120)"/><path d="M20 7l-8 4v10l8-4z" fill="rgb(192 166 98)"/></svg>Sand</button>
    </div></div>
    </div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script type="module" src="/app.js"></script>
</body>
</html>
